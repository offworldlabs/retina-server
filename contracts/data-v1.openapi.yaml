      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryPosition:
      properties:
        hex:
          type: string
          title: Hex
        ts:
          type: number
          title: Ts
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
        alt_baro:
          anyOf:
          - type: integer
          - type: 'null'
          title: Alt Baro
        gs:
          anyOf:
          - type: number
          - type: 'null'
          title: Gs
        track:
          anyOf:
          - type: number
          - type: 'null'
          title: Track
        position_source:
          type: string
          title: Position Source
        multinode:
          type: boolean
          title: Multinode
        n_nodes:
          type: integer
          title: N Nodes
        pos_sigma_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Pos Sigma M
        node_refs:
          items:
            type: string
          type: array
          title: Node Refs
        is_anomalous:
          type: boolean
          title: Is Anomalous
      type: object
      required:
      - hex
      - ts
      - lat
      - lon
      - position_source
      - multinode
      - n_nodes
      - node_refs
      - is_anomalous
      title: HistoryPosition
    HistoryResult:
      properties:
        aircraft:
          items:
            $ref: '#/components/schemas/HistoryPosition'
          type: array
          title: Aircraft
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - aircraft
      - next_cursor
      title: HistoryResult
    KeyedRefusal:
      properties:
        detail:
          $ref: '#/components/schemas/KeyedRefusalDetail'
      type: object
      required:
      - detail
      title: KeyedRefusal
    KeyedRefusalDetail:
      properties:
