          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
          - type: 'null'
          title: Lon
        alt_baro:
          anyOf:
          - type: number
          - type: string
            const: ground
          - type: 'null'
          title: Alt Baro
        gs:
          anyOf:
          - type: number
          - type: 'null'
          title: Gs
        track:
          anyOf:
          - type: number
          - type: 'null'
          title: Track
        seen:
          anyOf:
          - type: number
          - type: 'null'
          title: Seen
        position_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Position Source
        multinode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Multinode
        n_nodes:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Nodes
        pos_sigma_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Pos Sigma M
        node_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Node Refs
        is_anomalous:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Anomalous
      type: object
      required:
      - hex
