    LookupAircraft:
      properties:
        hex:
          type: string
          title: Hex
        flight:
          anyOf:
          - type: string
          - type: 'null'
          title: Flight
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
          - type: 'null'
          title: Lon
        alt_baro:
          anyOf:
          - type: number
          - type: string
            const: ground
          - type: 'null'
          title: Alt Baro
        gs:
          anyOf:
          - type: number
          - type: 'null'
          title: Gs
        track:
          anyOf:
          - type: number
          - type: 'null'
          title: Track
        seen:
          anyOf:
          - type: number
