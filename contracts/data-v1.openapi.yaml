          - type: 'null'
          description: Lowest ground speed, knots, inclusive.
          title: Gs Min
        description: Lowest ground speed, knots, inclusive.
      - name: gs_max
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Highest ground speed, knots, inclusive.
          title: Gs Max
        description: Highest ground speed, knots, inclusive.
      - name: hex
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated ICAO hex codes, at most 1000; case-insensitive.
          title: Hex
        description: Comma-separated ICAO hex codes, at most 1000; case-insensitive.
      - name: callsign
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Callsign prefix, case-insensitive.
          title: Callsign
        description: Callsign prefix, case-insensitive.
      responses:
        '200':
          description: 'Server-sent events: `aircraft` and `error` events, and `keepalive` comments.'
          content:
            text/event-stream: {}
        '401':
          description: No key was sent, or it is not valid.
