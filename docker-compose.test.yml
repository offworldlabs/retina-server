# ── Test overlay (the retina-test droplet) ───────────────────────────────────
# Combined with docker-compose.yml (the shared base), exactly like the prod and
# staging overlays. This file carries only the values that are inherently
# per-environment: hostnames/CORS · droplet capacity · fleet scale.
#
# Usage (the host's ./.env sets COMPOSE_FILE, so this is normally implicit):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# This replaced a standalone, non-overlay file that declared its own build,
# volumes, healthcheck and cert mount, and booted deploy/start-test.sh to copy a
# hand-maintained deploy/nginx-test.conf into place. It was the last stack
# outside the shared template, and so the last place a header, rate limit or
# route could differ from what production serves without anything noticing.
#
# What this environment is for is trying a branch under load before it is
# reviewed. It runs the same fleet shape staging does, so a change measured here
# means something about what staging will then see; it is deployed by rsync from a
# working tree (`just deploy-test`) rather than from main, which is the difference
# that matters.

services:
  server:
    container_name: retina-test-server
    # Consumed by services/alerting.py, which otherwise sees the container id or
    # the service name (varies by Compose version), neither of which says which
    # droplet raised an alert.
    hostname: retina-test
    # No TCP ingest, for the same reason staging closes it: there are no real
    # receiver nodes here, and the fleet reaches the server as server:3012
    # over the compose network rather than via the host port. Publishing it would
    # be pure exposure — and RETINA_ENV=test silences the missing-RADAR_NODE_TOKEN
    # warning, so anything on the internet could register itself as a node.
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # Matches staging, which is the point of this droplet. Relaxes the
      # JWT_SECRET boot check and the missing-key warnings in radar.py and
      # tcp_handler.py while the build-out continues (ClickUp 86cb1emcx);
      # production now names itself honestly, see docker-compose.prod.yml.
      - RETINA_ENV=test
      # Overnight dark-solver run 2026-09-05: exercise the free-altitude
      # multistart solve (feat/free-altitude-solve) on this droplet only.
      - SOLVER_ALT_MODE=free
      # The fleet sends each node at ~1 Hz with jitter; a 1.0 s per-node
      # minimum interval was refusing ~12 of its 37 frames/s (counter
      # node_frames_rate_limited), starving the trackers to ~0.5 Hz.
      - NODE_FRAME_MIN_INTERVAL_S=0.5
      # Stale-track exclusion (feat/measurement-epochs): 3 s stripped a node from
      # most candidates on this fleet (sim p_miss up to 0.5, ~1 Hz frames):
      # mean nodes/candidate 3.7 -> 2.5, 14,573 skips/20 min.  With epoch
      # alignment correcting the delay along its Doppler, 8 s is safe.
      - TRACK_MAX_STALE_S=8
      # Dark track-following lane (feat/dark-track-following): binding here so the
      # test droplet measures continuity; main defaults to shadow.
      - DARK_FOLLOW_MODE=binding
      # Test-only experiment (cap16): follow a dark key after 2 solves instead of 3.
      - DARK_FOLLOW_MIN_SOLVES=2
      # A/B of the turn-break fix on this droplet only: retina-tracker's packaged
      # q_doppler=0.5 sustains ~2 Hz/s of Doppler acceleration, so a 3 deg/s turn
      # falls outside the chi-square gate and the track dies mid-turn. Offline
      # replay put 20 at a tenth of the turning breaks for 20% worse Doppler RMS;
      # main keeps the library's 0.5 until this measures the same live.
      - TRACKER_PROCESS_NOISE_DOPPLER=20
      # This environment's Access application, on test-admin.retina.fm.
      - CF_ACCESS_AUD=e5ff9de8d1ca5fbc62b38d102d92a1fc7d910d5f89ef388caf63c83e828493b3
      # The simulation subsystem, likewise asked for by name rather than
      # inherited from what this environment is called. This droplet is a
      # synthetic fleet and nothing else, so the ingest write path main.py gates
      # on this flag is the whole of its data in.
      - SYNTHETIC_FLEET_ENABLED=1
      # Sign-in links go to this container's log, not to a mailbox. This box is
      # deployed to from any branch on a whim, so real mail from it means
      # mailing whoever a half-finished change happens to name; and it holds no
      # Cloudflare token, so `smtp` would resolve to unconfigured and answer 503,
      # leaving the flow untestable here. Read one with:
      #
      #     docker compose logs server | grep -A 12 'not sent'
      #
      # services/mail.py refuses this value outright when RETINA_ENV=production,
      # so it cannot travel. Staging deliberately keeps `smtp`: a transport only
      # production exercises is one nobody has tested.
      - MAIL_TRANSPORT=log
      # Labels alerts. It matches RETINA_ENV above only because this droplet is
      # named for what it is; the two answer different questions, and staging
      # sets them to different values. See services/alerting.py.
      - ALERT_ENVIRONMENT=test
      # The same two settings at the same values as production; see
      # docker-compose.prod.yml for what they do and why the cooldown sits here.
      - ALERT_WEBHOOK_FORMAT=clickup_chat
      - ALERT_COOLDOWN_S=3600
      - CORS_ORIGINS=https://test-towers.retina.fm,https://test-api.retina.fm,https://test-admin.retina.fm,https://test-app.retina.fm
      # Hostnames consumed by deploy/render-nginx-config.py, which start.sh runs
      # at boot to render deploy/nginx/nginx.conf.template.
      #
      # Every name here resolves and answers, verified 2026-09-16. An earlier
      # note said this droplet's origin certificate covered only four SANs and
      # the rest were unreachable; that is no longer true, and it is worth not
      # reinstating without probing first, because it reads as a reason not to
      # bother checking them.
      - HOST_MAIN=test-towers.retina.fm
      - HOST_API=test-api.retina.fm
      # The public surface, and the whole console: real nodes at /map, the
      # simulator at /sim (and /sim/physics, which tunes it). One name per
      # environment, so the route table no longer depends on which hostname
      # the browser used. `test-map`, `test-testmap`, `test-dash` and
      # `test-data` are retired: Cloudflare redirects into this name that
      # reach no origin.
      - HOST_APP=test-app.retina.fm
      - HOST_ADMIN=test-admin.retina.fm
      - CSP_CONNECT_SRC=https://test-api.retina.fm https://test-admin.retina.fm wss://*.retina.fm
    # 4 cores / 8 GB, the same shape as staging and production, because the
    # solver could not keep up with this fleet on 2: at ~0.7 candidates/s and
    # ~2.5 s of CPU per solve, solving alone needs ~2 cores, which a 1.5-CPU
    # cap on a 2-core box cannot give.
    #
    # cpus 3.0 = the main process plus SOLVER_WORKERS=2 solver pool children
    # (services/tasks/solver.py), leaving a core for the fleet and the host.
    # memory 3G = measured ~1.3 GiB in the app plus ~200 MiB per spawn child,
    # with ceiling-not-fit headroom.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
    # nginx proxies /api/towers to tower-finder-service over this network, same
    # as staging and production. This droplet runs that stack too now (its
    # deploy job there is workflow_dispatch; the co-located checkout lives at
    # /opt/tower-finder-service), so the divergence check-env-parity.py used to
    # record for test alone is gone.
    networks:
      - default
      - retina-edge

  fleet:
    container_name: retina-test-fleet
    environment:
      # 50 nodes at a 1.0s per-node detection rate. FLEET_INTERVAL is per node —
      # orchestrator.py staggers each node's first send by interval/n_nodes and
      # re-arms at +interval — so the aggregate the server sees is
      # n_nodes / interval = 50 frames/s, 4x production's 12.5.
      #
      # Kept identical to staging on purpose. This droplet's value is telling you
      # what staging will do before main does, which only works while the two run
      # the same fleet.
      #
      # 4x production's frame rate and, on the same 4 cores, 4x its per-core
      # load: 12.5 fps/core against prod's 3.1.
      #
      # Measured here at this size: the frame path copes (41 of 50 fps, nothing
      # dropped, frame queue at zero) while the solver does not. Per-solve cost is
      # 45-52s against production's 17s, the solver queue oscillates to ~28% where
      # production sits at 0%, and the success rate is 8% against production's 80%.
      # Usable, but not a faithful rehearsal of production's solver.
      #
      # Those figures predate the solver's re-solve suppression
      # (SOLVER_RESOLVE_INTERVAL_S, services/tasks/solver.py), which was measured
      # to cut candidates reaching the LM by about half at this fleet shape.
      # Re-measure before quoting them.
      #
      # 200 nodes at 0.5s was tried first and was much worse: 178 of a notional 400
      # fps, latency past 30s and still climbing. If you want that overload again,
      # set it here, watch it, and set it back — do not leave it on, and do not put
      # it on staging.
      #
      # Watch solver_avg_latency_s over minutes, not seconds: it is a cumulative
      # mean, so a fresh boot reads low and climbs for several minutes while it
      # converges. solver_last_latency_s is the honest per-solve number. Reading
      # the average at 50s is how this was first, wrongly, called healthy.
      - FLEET_NODES=50
      - FLEET_REGIONS=us
      - FLEET_METRO=gvl
      # Held at prod's 16/25 proportion of the node count, so changing the fleet
      # size does not change the share of nodes with designed coverage geometry
      # (shared illuminator, aimed antennas, low GDOP). FLEET_METRO already forces
      # all 50 into the one metro; this only decides how many of them get the
      # coverage-cluster treatment rather than an ordinary tower.
      - FLEET_N_CLUSTER=32
      - FLEET_N_CLUSTERS=1
      # Same reasoning as staging: the ring surrounds the core with receivers that
      # all share one illuminator and all aim inward, which is geometry a real
      # fleet will not have. Scatter clumps sites where people live and varies the
      # hardware, so the load being measured is load the system will actually meet.
      - FLEET_LAYOUT=scatter
      - FLEET_METRO_TRAFFIC_FRAC=0.85
      - FLEET_MODE=adsb
      # 50 nodes / 1.0s = 50 fps
      - FLEET_INTERVAL=1.0
      - FLEET_TIME_SCALE=1.0
      # Above prod's 15-30, below the 40-60 the overload run used. Aircraft count
      # is independent of node count, but it multiplies solver work: pairing cost
      # goes as nodes x aircraft, so it is the other half of the load knob.
      - FLEET_MIN_AIRCRAFT=25
      - FLEET_MAX_AIRCRAFT=40
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      # Gates concurrent connection *establishment* only, not the steady-state
      # send rate. Half the node count, so the fleet reconnects in two batches
      # after a deploy.
      - FLEET_CONCURRENCY=25
      - FLEET_CONNECT_RETRIES=30
    # Measured at 25 MiB running four times these nodes, so 400M is generous.
    # Matched to staging so the two stay comparable.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 400M

networks:
  retina-edge:
    # Created out of band on the droplet, and shared with the separately
    # deployed tower-finder-service stack, which declares it external too.
    # Neither stack creates or removes it.
    external: true
