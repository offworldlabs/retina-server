[project]
name = "retina-server"
version = "0.0.0"
# The interpreter the image and CI run, so the lock is solved for it alone.
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "httpx==0.27.0",
    "orjson==3.11.8",
    "python-dotenv==1.0.1",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "cryptography==46.0.6",
    "boto3==1.42.89",
    "fastapi-users[sqlalchemy]==13.0.0",
    # Direct since core/access_identity.py imports it to verify Cloudflare Access
    # assertions; it had arrived only as a transitive of fastapi-users, which pins
    # this exact version, so it is not a free choice. [crypto] for RS256.
    "pyjwt[crypto]==2.8.0",
    "aiosqlite==0.20.0",
    "alembic==1.13.2",
    "pyarrow==16.1.0",
    # All five, because retina-simulation imports the other four.
    "retina-geolocator",
    "retina-tracker",
    "retina-custody",
    "retina-simulation",
    "retina-analytics",
]

[dependency-groups]
dev = [
    "coverage==7.8.0",
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "pytest-split==0.11.0",
    "pytest-xdist==3.6.1",
    "moto[s3]==5.1.4",
    "ruff==0.16.2",
    "vulture==2.14",
    "pre-commit==4.6.2",
]

# An application run from this directory, not a distribution: uv installs its
# dependencies and never the backend itself.
[tool.uv]
package = false

[tool.uv.sources]
retina-geolocator = { path = "../libs/retina-geolocator", editable = true }
retina-tracker = { path = "../libs/retina-tracker", editable = true }
retina-custody = { path = "../libs/retina-custody", editable = true }
retina-simulation = { path = "../libs/retina-simulation", editable = true }
retina-analytics = { path = "../libs/retina-analytics", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No coverage here, or a run of one file measures the whole backend and fails
# the threshold however its tests went: `just test-ci` and CI ask for it.
addopts = [
    # An unregistered mark, a typo or one no plugin defines, fails collection
    # rather than warning and doing nothing.
    "--strict-markers",
]
# A per-test ceiling, so a runaway test fails in seconds and names itself
# instead of consuming the CI job's whole 20 minute budget in silence. The cap
# is deliberately far above any real test (the slowest is about 11s) because
# its job is to catch pathology, not to police normal variation. thread method
# so the failure carries a stack dump of where the test was stuck.
timeout = 120
timeout_method = "thread"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    "simulation/*",
    "*/conftest.py",
    # Auth routes. The flows this was written for needed a browser and an
    # external provider; the magic-link endpoints that replaced them are covered
    # by tests/test_magic_link_routes.py, so this omission now only holds the
    # reported figure down:
    "routes/auth.py",
    # Simulation/test-only endpoints — not production code paths:
    "routes/test.py",
]

[tool.coverage.report]
# Fixtures a test wrote into its own tmp_path. pytest-cov exports
# COVERAGE_PROCESS_START, so a subprocess a test spawns measures under this
# config too, and `source = ["."]` then resolves against that subprocess's cwd:
# tests/test_deploy_scope.py runs deploy-scope.py inside a throwaway git repo,
# and that repo's app.py lands in the data as an unrun file. Harmless while the
# report runs beside the tests that made it, fatal to backend-coverage, which
# reports on a runner where the path never existed and stops at "No source for
# code". Here rather than in [run] omit, which filters what is measured and so
# never sees a file the source walk adds back at report time.
omit = ["*/pytest-of-*/*"]
# The one threshold. pytest-cov applies it to a run that measures (`just
# test-ci`), and `coverage report` to CI's combined shards.
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = true
show_missing = true

# Shared ruff standard for offworldlabs Python repos. The keys below are checked
# against offworldlabs/ops:ruff-shared.toml by the `ruff-config` pre-commit hook
# — edit them there, not here. target-version is deliberately per-repo and
# tracks this package's requires-python. The extra per-file-ignores entry for
# simulation/* is a permitted local addition.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "E402",  # module-level import not at top — env setup before imports is intentional
    "S101",  # assert in tests is fine
    "S104",  # binding to 0.0.0.0 is intentional (Docker)
    "S105",  # hardcoded password false positives on dev defaults
    "S106",  # hardcoded password false positives
    "S110",  # try-except-pass is used intentionally
    "S112",  # try-except-continue is intentional in iteration
    "S310",  # URL open audit — URLs are constructed internally
    "S311",  # pseudo-random is fine for non-crypto uses
    "S501",  # requests without verify — internal calls
    "S603",  # subprocess calls are in controlled scripts
    "S607",  # partial executable path is fine for scripts
    "B008",  # function call in default arg — Depends() is FastAPI pattern
    "B905",  # zip strict — not needed everywhere
    "SIM105", # contextlib.suppress — try/except is more explicit
    "SIM102", # nested if — readability preference
    "SIM108", # ternary operator — readability preference
    "SIM117", # combine with statements — readability preference
    "UP017", # datetime.UTC — cosmetic, timezone.utc is fine
    "UP028", # yield from — explicit loop is clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S", "E"]
"simulation/*" = ["S"]
