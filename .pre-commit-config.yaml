# The ops hooks are scoped with args: [<dir>] — dead-code must not walk libs/,
# which holds the retina-* submodules that run these same hooks in their own
# repos, and ruff-config needs pointing at each pyproject.toml explicitly.
#
# ruff-config runs twice, once per copy of the shared standard in this repo:
# backend/pyproject.toml and the root pyproject.toml. The root copy exists so
# Python outside backend/ inherits the standard rather than ruff's defaults;
# see the comment in that file. Checking both is what stops the duplication
# becoming drift.
#
# The ruff hooks are unrestricted: every tracked .py in this repo now resolves
# to the same standard. libs/ is not covered because submodule contents are
# gitlinks, so pre-commit never passes them to a hook.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  # The only thing that validates a workflow edit. The deploy, staging and smoke
  # jobs run on push to main, so a green PR on a workflow change proves close to
  # nothing, and main deploys straight to production. Picked up by CI for free:
  # the Lint (pre-commit) step already runs this file against everything.
  #
  # actionlint also shellchecks each inline `run:` block when shellcheck is on
  # PATH, which is what covers the three copies of the deploy script.
  #
  # Where this lies to you: that shellcheck is whichever one is installed, so a
  # green run here does not promise a green run in CI. SC2119 on
  # staging-deploy-verify.yml fires on the runner's shellcheck and not on 0.11,
  # which is why the disable there looks unnecessary locally. Read CI's finding
  # and add a targeted disable rather than assuming the runner is wrong.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Every shell script, deploy/ above all: the gate and the deploy run as root
  # on the droplets, and nothing else checks them before they do. Warnings and
  # errors only; the older scripts carry style notes not worth the churn.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/offworldlabs/ops
    rev: hooks-v1.0
    hooks:
      - id: dead-code
        args: [backend]
      - id: ruff-config
        args: [backend]
      - id: ruff-config
        alias: ruff-config-root
        name: ruff config matches the shared standard (root)
        args: ["."]
