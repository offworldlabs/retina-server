# Security headers for API-only vhosts. The one HTML page, the API reference
# at /, sets its own CSP in the backend (routes/reference.py); the SPA policy in
# security-headers-page.conf would refuse its script.
# RETINA_IF TLS
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# RETINA_ENDIF
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# RETINA_INCLUDE snippets/origin-marker.conf
