# Says which origin answered. A smoke probe asserts that a hostname responded,
# never that THIS service responded: on 2026-09-14 an Origin Rule moved the
# tower vhost's hostname to tower-finder-service and every probe kept passing,
# because both origins return the same status and the same security headers.
#
# No literal hostname here, for the reason snippets/towers-proxy.conf gives:
# the parity check tokenises each environment's own HOST_* values, so a
# production name survives in the staging and test renders and reads as a diff.
#
# A literal, not a substituted variable: the parity check requires environments to
# render identically once hostnames are tokenised, and a placeholder would have
# to be registered in SUBSTITUTIONS, in HOST_VARS and in all four compose
# overlays before the renderer would boot.
#
# `always`, or nginx drops it on the catch-all's 421 and on every error page.
#
# deploy/origin-marker.sh carries the value the smoke suites look for. The two
# are pinned together by backend/tests/test_nginx_origin_marker.py.
add_header X-Retina-Origin "retina-server" always;
