# Proxy to tower-finder-service, a separate compose stack on the shared
# external `retina-edge` network.
limit_req zone=api burst=60 nodelay;
# Resolve at request time (hence the variable) so nginx still boots when that
# stack is down: a missing upstream 502s instead of failing boot. The variable
# is also why any caller not already under /api/towers must rewrite explicitly,
# since proxy_pass with a variable does not substitute the location prefix.
resolver 127.0.0.11 valid=10s;
set $tfs_upstream tower-finder-service;
proxy_pass http://$tfs_upstream:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 120s;
