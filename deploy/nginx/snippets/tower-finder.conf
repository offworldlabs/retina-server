# Proxy to the standalone tower-finder-service, a separate compose stack reached
# over the shared external `retina-edge` docker network rather than the local
# FastAPI app that answers everything else.
limit_req zone=api burst=60 nodelay;
# Resolve the upstream via Docker's embedded DNS at request time (note the
# variable) so this nginx still boots when the tower-finder-service stack is
# down: a missing upstream then 502s instead of failing boot.
#
# The variable is also why every caller of this snippet that is not already
# under /api/towers must `rewrite` explicitly. With a variable in proxy_pass
# nginx does not substitute the location prefix, so the request URI is passed
# through exactly as it arrived.
resolver 127.0.0.11 valid=10s;
set $tfs_upstream tower-finder-service;
proxy_pass http://$tfs_upstream:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 120s;
