# Must be included by every vhost rooted at frontend/dist: the SPA calls its own
# origin (api.ts: API_BASE = "/api") and renders the search form on all of them,
# so a vhost that skips this serves a different ranking from the same UI.
#
# Longer prefix than `location /api/`, so nginx matches this first.
location /api/towers {
    # RETINA_INCLUDE snippets/tower-finder.conf
}
