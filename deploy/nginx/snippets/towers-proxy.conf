# The tower stack, proxied to tower-finder-service. Must be included by EVERY
# vhost that answers /api/, not just the ones rooted at frontend/dist: the same
# three routes exist in retina's monolith (backend/routes/towers.py,
# backend/routes/config.py) and the two implementations have already diverged,
# so a vhost that skips this serves a different answer from the same path. The
# split-brain this closes was observable in production — one Phoenix query
# returned KAET 183.0 MHz on the vhosts that included this file and KSAZ-TV
# 195.0 MHz on the dashboard vhost, which did not.
#
# No literal hostname anywhere below, deliberately: deploy/check-env-parity.py
# compares the environments by substituting each one's HOST_* values back to a
# role token, so a hardcoded production name survives in the staging and test
# renders only, and reads as a parity failure. Name the ROLE, not the host.
#
# All three are LONGER prefixes than `location /api/`, so nginx matches these
# first on every vhost that also defines that one. None of them is an exact
# (`location =`) match anywhere in the template, so nothing outranks them.
#
# Each block re-includes tower-finder.conf rather than sharing one: the
# `set $tfs_upstream` in there is per-location state, and a location that
# inherits nothing must declare it itself.

# The tower search itself. The SPA calls its own origin (api.ts:
# API_BASE = "/api") and renders the search form on every frontend vhost.
location /api/towers {
    # RETINA_INCLUDE snippets/tower-finder.conf
}

# Elevation lookup for the search form's altitude field (api.ts fetchElevation).
# Same {latitude, longitude, elevation_m} shape from both implementations, so
# this move is invisible to the caller — but it is the elevation the SERVICE
# resolved, which is the one its ranking used.
location /api/elevation {
    # RETINA_INCLUDE snippets/tower-finder.conf
}

# The ranking config the search actually runs on. GET is unauthenticated in
# both implementations; PUT is NOT interchangeable — the monolith gates it on an
# admin session, the service on `Authorization: Bearer $TOWER_FINDER_ADMIN_TOKEN`.
# A PUT here therefore writes the SERVICE's config, which is the one that
# affects /api/towers above. The monolith's own tower_config.json — what the
# `config_degraded` alert is about — is no longer reachable on these vhosts;
# use PUT /api/admin/config/towers, which is not under this prefix and stays on
# the monolith everywhere. See docs/runbook.md.
location /api/config {
    # RETINA_INCLUDE snippets/tower-finder.conf
}
