# The tower stack, proxied to tower-finder-service — the only implementation:
# the monolith's copies of these routes are deleted. Still included by EVERY
# vhost that answers /api/, not just the ones rooted at frontend/dist; the
# failure mode has just softened, from a wrong answer to a 404. While the
# monolith still had its own copy the two had diverged, and the split-brain
# was observable in production — one Phoenix query returned KAET 183.0 MHz on
# the vhosts that included this file and KSAZ-TV 195.0 MHz on the dashboard
# vhost, which did not.
#
# No literal hostname anywhere below, deliberately: deploy/check-env-parity.py
# compares the environments by substituting each one's HOST_* values back to a
# role token, so a hardcoded production name survives in the staging and test
# renders only, and reads as a parity failure. Name the ROLE, not the host.
#
# All four are LONGER prefixes than `location /api/`, so nginx matches these
# first on every vhost that also defines that one. None of them is an exact
# (`location =`) match anywhere in the template, so nothing outranks them.
#
# Each block re-includes tower-finder.conf rather than sharing one: the
# `set $tfs_upstream` in there is per-location state, and a location that
# inherits nothing must declare it itself.

# The tower search itself. The SPA calls its own origin (api.ts:
# API_BASE = "/api") and renders the search form on every frontend vhost.
location /api/towers {
    # RETINA_INCLUDE snippets/tower-finder.conf
}

# Elevation lookup for the search form's altitude field (api.ts fetchElevation).
# Both implementations returned the same {latitude, longitude, elevation_m}
# shape, which is what made the move invisible to the caller.
location /api/elevation {
    # RETINA_INCLUDE snippets/tower-finder.conf
}

# The ranking config the search actually runs on. GET is unauthenticated; PUT
# requires `Authorization: Bearer $TOWER_FINDER_ADMIN_TOKEN` and writes the
# service's config — the only tower config there is. The monolith's own
# tower_config.json, and the `config_degraded` alert that watched it, went
# with the monolith tower stack. See docs/runbook.md.
location /api/config {
    # RETINA_INCLUDE snippets/tower-finder.conf
}

# Address lookup for the search form's address field (the service's api.ts
# geocodeAddress). POST only, and the one route here that this repo's own
# bundle does not call yet: the field shipped in the service's UI first. It
# is forwarded all the same, because the vhosts that serve either bundle must
# answer the same set of tower routes — a vhost missing this one 404s the
# lookup from the app's `location /` fallback, which never had the handler.
#
# The smoke probes send an empty query. The service's own validation refuses
# that with 422 before either geocoder upstream is asked, so the check is
# deterministic and cannot be mistaken for the fallback's 404.
location /api/geocode {
    # RETINA_INCLUDE snippets/tower-finder.conf
}
