# Static SPA serving. Include this AFTER setting `root` in the vhost.
#
# NOTE: the locations below declare their own add_header, which by nginx's
# rules means they do NOT inherit the server-level security headers. That is
# pre-existing production behaviour and is preserved here deliberately — this
# refactor is meant to make staging match production, not to change what
# production serves.
location / {
    try_files $uri $uri/ /index.html;
}

# Never cache the HTML entry point — ensures users get the latest JS bundle hashes
location = /index.html {
    add_header Cache-Control "no-store, no-cache";
}

# Only Vite's output carries a content hash in its name, and all of it lands
# under /assets/, so that is the only tree the edge may keep for a week: on a
# file whose name survives a deploy (the dashboard's theme-boot.js) the same
# policy leaves Cloudflare serving the old copy under the new index.html until
# the week is up.
location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# Every other static file is fetched afresh on each request, by the edge and
# the browser alike, exactly as index.html is. `no-cache` alone will not do:
# Cloudflare then caches and revalidates at the edge but stamps the zone's
# Browser Cache TTL (4 h) on the response, so a browser sits on a stale copy
# that long after a deploy. `no-store` is the form it passes through untouched.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "no-store, no-cache";
}
