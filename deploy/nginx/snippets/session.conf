# Session-read endpoints (/api/auth/me and the owner routes under it, such as
# /api/auth/me/nodes, and /api/auth/logout) — same backend as snippets/auth.conf
# but the `session` zone (5r/s burst=20) rather than `auth` (5r/m burst=3).
#
# These sit under /api/auth/ but are not a credential surface: they read or drop
# an existing session, or read the caller's own nodes. They are split out
# because the console spends several at once: an owner's node page asks for the
# session, the node list, the node, its analytics, its report, its configuration
# history and its events together, the overview four, and the RF page polls the
# SNR trend every minute. burst=20 takes such a page and a refresh of it without
# a 429, where the credential-grade burst=3 would refuse the node page's fifth.
# Longest-prefix matching puts these ahead of the /api/auth/ location.
#
# The owner's archive under /api/auth/me/archive is not one of them: a Data
# Explorer scan pages through it and a download can be large, so it has a
# longer location of its own on snippets/api.conf, as the public archive does.
#
# burst=20 admits 21 back-to-back requests, so deploy/staging-smoke-test.sh must
# send MORE than that to observe a 429 — it sends 30. A run of exactly `burst`
# reports a false pass-turned-failure; see the note in check_rate_limit.
limit_req zone=session burst=20 nodelay;
proxy_pass http://127.0.0.1:8000;
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 30s;
