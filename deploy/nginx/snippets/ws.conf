# WebSocket → FastAPI backend. Long timeouts: these connections are meant to
# stay open for the life of the page.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# RETINA_INCLUDE snippets/proxy-common.conf
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
# A location-level access_log replaces the inherited one: same file, path only.
access_log /var/log/nginx/access.log path_only;
