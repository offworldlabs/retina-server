# ── Staging overlay ──────────────────────────────────────────────────────────
# Combined with docker-compose.yml (the shared base). Everything that is not
# inherently per-environment lives in the base; this file carries only the
# staging values for the things that legitimately differ:
#   hostnames/CORS · droplet capacity · whether the fleet runs at all (it
#     does not, as on production; only the test droplet runs one)
#
# Staging deliberately mirrors production in every other respect — same image
# pins, same volumes, same healthcheck, same nginx template, same authenticated
# ingest path, no simulator — so a change that breaks prod breaks staging first.
#
# Usage (the host's ./.env sets COMPOSE_FILE, so this is normally implicit):
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Adding anything else here will fail deploy/check-env-parity.sh in CI. If a new
# setting really is per-environment, add its key to that script's allowlist in
# the same commit, so the divergence is a recorded decision rather than drift.

services:
  server:
    container_name: retina-staging-server
    # Consumed by services/alerting.py, which otherwise sees the container id or
    # the service name (varies by Compose version), neither of which says which
    # droplet raised an alert.
    hostname: retina-staging
    # No TCP ingest on staging. The base publishes 3012 for real receiver nodes;
    # staging has none on that path (its real nodes arrive over the HTTP
    # mirror) and runs no fleet that would reach it over the compose network
    # either. Verified with `ss`: zero established connections on it.
    # Publishing it was therefore pure exposure —
    # and worse than it looks, because RETINA_ENV=test silences the missing
    # RADAR_NODE_TOKEN warning, so anything on the internet could have registered
    # itself as a node here. Production keeps 3012; that is where real nodes land.
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # Still `test` rather than `staging` during the build-out, which relaxes
      # three backend guards: JWT_SECRET stops being required, and the
      # missing-key warnings in radar.py and tcp_handler.py downgrade. Tracked
      # in ClickUp 86cb1emcx; revert to the real environment name there, not
      # here.
      - RETINA_ENV=test
      # This environment's Access application, on staging-admin.retina.fm.
      - CF_ACCESS_AUD=e81258e72360b51069e64c82ca9762b52556898d8096b20873833ff50f7eb66e
      # The E2E suite retires the nodes it registers, which needs force because
      # a registered node is live until something evicts it. Confining force to
      # the suite's own prefixes means a bug in the teardown cannot reach a real
      # board. Production leaves this unset, and so unrestricted, because a
      # decommissioned receiver needs force too.
      - NODE_FORCE_RETIRE_PREFIXES=e2e-,synth-e2e-
      # No SYNTHETIC_FLEET_ENABLED here, deliberately: staging runs no fleet
      # (see the `sim` profile on the service below), so the simulation ingest
      # write path main.py gates on that flag stays unmounted and the admin
      # console has no /sim page, exactly as on production. The test droplet is
      # the one environment that sets it (docker-compose.test.yml).
      # Labels alerts, and a variable of its own rather than a reading of
      # RETINA_ENV above: this box names itself `staging` in an alert while still
      # running the `test` guards. See services/alerting.py.
      - ALERT_ENVIRONMENT=staging
      # The same two settings at the same values as production; see
      # docker-compose.prod.yml for what they do and why the cooldown sits here.
      - ALERT_WEBHOOK_FORMAT=clickup_chat
      - ALERT_COOLDOWN_S=3600
      - CORS_ORIGINS=https://staging-towers.retina.fm,https://staging-api.retina.fm,https://staging-admin.retina.fm,https://staging-app.retina.fm
      # Hostnames consumed by deploy/render-nginx-config.py, which start.sh runs
      # at boot to render deploy/nginx/nginx.conf.template. One template serves
      # both environments; only these values change.
      #
      # Every vhost is defined here whether or not its name resolves: the
      # Cloudflare origin cert is *.retina.fm, so an unresolved name costs
      # nothing, and keeping the two variable sets the same shape is what lets
      # the parity check assert the rendered configs are identical.
      - HOST_MAIN=staging-towers.retina.fm
      - HOST_API=staging-api.retina.fm
      # The public surface: real nodes at /map. `testmap.retina.fm` — the name
      # people already have from when staging's map was the simulator demo —
      # is a Cloudflare redirect onto this one's /map, and so onto the real
      # network; `staging-map`, `staging-dash` and `staging-data` are the same.
      - HOST_APP=staging-app.retina.fm
      - HOST_ADMIN=staging-admin.retina.fm
      # The only host-naming part of the CSP. wss://*.retina.fm already covers
      # both environments, so only the two explicit origins vary.
      - CSP_CONNECT_SRC=https://staging-api.retina.fm https://staging-admin.retina.fm wss://*.retina.fm
    # Sized to the droplet, which is the point of an overlay: 4 cores and 7941 MB
    # with NO swap, under 2 GB of it in use at rest, containers included. Limits are
    # ceilings rather than reservations so nothing fails at boot, which means the
    # OOM killer picks the victim under load and no swap absorbs a spike; 1600 +
    # the fleet's 400 commits 2000M against ~6 GB free, and on retina-test under
    # a much heavier fleet the app sat at 152 MiB and the fleet at 25 MiB, so
    # memory is not what constrains this box. A deploy builds the image on-box
    # beside the running containers, and the build is uncapped, so its cost is
    # solver CPU share, not memory.
    #
    # cpus 3.0 = the main process plus SOLVER_WORKERS=2 solver pool children
    # (services/tasks/solver.py), leaving a core for the fleet and the host, the
    # shape docker-compose.test.yml already runs. The solver's work arrives in
    # bursts that want more than two cores for seconds at a time, so a lower
    # ceiling shows up as throttling rather than as load, and this box averages
    # under 15% of its four cores.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 1600M
    # nginx proxies /api/towers to tower-finder-service over this network, so
    # the server has to be on it or that location 502s. Staging never joined it
    # while only production ran the service; it runs one now.
    networks:
      - default
      - retina-edge

  fleet:
    container_name: retina-staging-fleet
    # Not started on staging. Staging is production's rehearsal, and production
    # runs no simulator (docker-compose.prod.yml puts its fleet behind this same
    # profile): a fleet here loaded the solver with 50 synthetic nodes production
    # never sees, put a simulated map on staging's public hostname where the
    # real network belongs, and meant a staging deploy rehearsed a container
    # production does not run. The test droplet is where the simulator lives
    # (docker-compose.test.yml); it is deployed from a working tree rather than
    # from main, which is the right place for a fleet to be sized and bounced.
    #
    # A profile no deploy enables is what keeps a bare `docker compose up -d`
    # on the droplet from quietly bringing it back. The sizing below is kept,
    # not deleted, so the fleet can be brought back for an afternoon without a
    # PR — same as production:
    #   docker compose --profile sim up -d --build --no-deps fleet
    #   docker compose restart server   # re-registers the synthetic nodes
    # The server will refuse its frames until SYNTHETIC_FLEET_ENABLED=1 is also
    # set on the server (above), so that is a two-line experiment, on purpose.
    profiles: ["sim"]
    environment:
      # Scoped to the Greenville, SC metro, and run harder than production without
      # being run into the ground: 50 nodes at a 1.0s per-node detection rate, so
      # the server sees n_nodes / interval = 50 frames/s against prod's 12.5. Fleet
      # scale is the one thing the environments are meant to differ on, and this is
      # what staging differs FOR — prod's 25 nodes at 2.0s is a demo stream, and a
      # rehearsal that never pushes the pipeline was not catching pipeline problems.
      #
      # 4x production's frame rate, and production, this droplet and retina-test
      # all have 4 cores, so per core it is 12.5 fps against production's 3.1,
      # which is 4x, and the solver feels the per-core number.
      #
      # Measured on retina-test at this size: the box holds the frame rate (41 of
      # 50 fps, no frames dropped) but the solver does not keep up. Per-solve cost
      # runs 45-52s against production's 17s, the solver queue oscillates to ~28%
      # where production sits at 0%, and 21 solves succeed against 243 failures
      # where production manages 80%. Nothing is dropping, so this is a usable
      # environment, but it is NOT a faithful rehearsal of production's solver.
      #
      # 200 nodes at 0.5s was tried first and was far worse: 178 of a notional 400
      # fps, latency past 30s and still climbing, queue filling behind it.
      #
      # If you want staging to reproduce production's solver behaviour rather than
      # merely survive, the fleet has to come down to production's own 25/2.0 —
      # which on the same core count matches production's per-core load. Measure on
      # retina-test before changing this in either direction.
      #
      # Note the trade either way: staging no longer reproduces production's frame
      # rate, so a regression that only shows up at 12.5 fps will not surface here
      # first. Everything structural — image, volumes, healthcheck, nginx template,
      # authenticated ingest — still matches, and that is what the parity check
      # holds.
      - FLEET_NODES=50
      - FLEET_REGIONS=us
      - FLEET_METRO=gvl
      # Held at prod's 16/25 proportion of the node count, so changing the fleet
      # size does not change the share of nodes with designed coverage geometry.
      - FLEET_N_CLUSTER=32
      - FLEET_N_CLUSTERS=1
      # Undesigned community layout rather than the ring.  The ring surrounds
      # the core with receivers that all share one illuminator and all aim
      # inward — geometry a real fleet will not have, so staging was measuring
      # the solver under conditions it will not meet.  Scatter clumps sites
      # where people live, gives each its own nearby illuminator, aims by hand
      # and varies the hardware.  Prod keeps the ring for the demo.
      - FLEET_LAYOUT=scatter
      - FLEET_METRO_TRAFFIC_FRAC=0.85
      - FLEET_MODE=adsb
      # 50 nodes / 1.0s = 50 fps
      - FLEET_INTERVAL=1.0
      - FLEET_TIME_SCALE=1.0
      # Above prod's 15-30, below the 40-60 the overload run used. Aircraft count
      # is independent of node count, but it multiplies solver work: pairing cost
      # goes as nodes x aircraft, so it is the other half of the load knob.
      - FLEET_MIN_AIRCRAFT=25
      - FLEET_MAX_AIRCRAFT=40
      - FLEET_BEAM_WIDTH_DEG=0
      - FLEET_MAX_RANGE_KM=0
      # Gates concurrent connection establishment only, not the steady-state send
      # rate. Half the node count, so the fleet reconnects in two batches after a
      # deploy rather than the twenty the old value of 10 would have taken.
      - FLEET_CONCURRENCY=25
      - FLEET_CONNECT_RETRIES=30
    # See the app's limits above. The fleet measured 25 MiB on retina-test running
    # four times this many nodes, so 400M is generous; the app should get the
    # larger share, and on a swapless box neither ceiling should be discovered by
    # the OOM killer.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 400M

networks:
  retina-edge:
    # Created out of band on the droplet, and shared with the separately
    # deployed tower-finder-service stack, which declares it external too.
    # Neither stack creates or removes it.
    external: true
