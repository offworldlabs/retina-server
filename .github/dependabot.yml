version: 2
updates:
  # Every action is pinned to a commit, so a pin moves only when this moves it:
  # Dependabot raises the SHA and the version comment beside it together. `/`
  # finds the workflows but not the composite actions, hence the second entry.
  # The cooldown keeps a release out of CI until it has been public for a week,
  # long enough for a compromised one to be noticed and pulled.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # A major version gets a PR of its own.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
