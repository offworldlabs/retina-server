name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. `branches:` on pull_request matches the PR's BASE, so
  # a PR stacked on a feature branch ran none of the jobs below while still
  # showing a green claude-review tick, which reads as a pass. What wants testing
  # is the head; where it is aimed is irrelevant.
  # `edited` is not in the default set (`opened`, `synchronize`, `reopened`) and
  # is the action a base-branch change arrives as. Without it, a PR retargeted
  # when its parent merges keeps the tick it earned against the old base and is
  # never validated against the new one, which is the second half of the trap
  # the base filter opened. The gates below discard the title and body edits
  # that come with it, and ci-ok reports under another name for them.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # So a branch can be run on demand, which was otherwise impossible.
  workflow_dispatch:

# Testing every PR regardless of base would otherwise multiply CI minutes: this
# cancels superseded runs on the same PR ref. Push-to-main runs (and manual
# workflow_dispatch runs) get a group unique to their own run_id instead, since
# the deploy jobs below hang off them and a half-run deploy is worse than a slow
# one: they are never cancelled, and (unlike a group shared with other runs on
# the same ref) they never queue behind an earlier run either. The deploy jobs'
# own job-level concurrency groups are what serialise deploys.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pull_request-{1}', github.workflow, github.ref) || format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  # Same condition the jobs carry, and for a sharper reason. Cancellation happens
  # when the new run is created, before any job-level `if:` is evaluated, so a
  # title edit would otherwise cancel a real run mid-flight and then skip every
  # job in the run that replaced it, leaving the PR with no signal at all. A
  # no-op edit queues instead, and skips quickly once it starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

env:
  # Single definition of the deploy directory. The ssh-action script blocks
  # below interpolate it, so moving the directory is one edit here. It is also
  # forwarded to the droplet (`envs: APP_DIR`), because deploy/pre-deploy.sh and
  # deploy/rollback.sh cd to an APP_DIR of their own and would otherwise fall
  # back to a default still naming the old directory, snapshotting and rolling
  # back a tree nothing is served from.
  APP_DIR: /opt/retina-server

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    # Three shards, because the serial combine job below costs ~18s whatever the
    # count: two leave the backend path at ~98s, and past three the other gate
    # jobs set the run's floor instead. Public runners are free.
    #
    # fail-fast off so one shard's failure does not cancel the other two. A red
    # shard tells you nothing about whether the rest of the suite passes, and
    # that is the first thing you want to know.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    # Job-wide rather than on the pytest step alone, so the step below that
    # asserts the core and the step that relies on it cannot end up reading
    # different environments: a guard that sets its own is no guard at all.
    # Steps that never invoke coverage are indifferent to it.
    env:
      COVERAGE_CORE: sysmon
      # One data file per shard, named so `coverage combine` in backend-coverage
      # recognises them as parallel fragments of one run rather than three
      # separate ones it should overwrite.
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup-python owns the interpreter, and uv, at the version the images
      # pin, syncs backend/.venv from the lock. --locked fails the job when
      # pyproject.toml has moved without uv.lock, including a submodule bump
      # that changed a lib's dependencies. The venv goes on PATH so every later
      # step finds pytest, pre-commit and python there without `uv run`.
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # When coverage cannot honour COVERAGE_CORE it warns and uses the C tracer
      # anyway, and one warning is invisible among the hundreds pytest prints, so
      # both the speed and the greenlet fix below could regress with nothing
      # failing. Enabling branch coverage is the realistic way to cause that
      # before CPython 3.14, sys.monitoring having no branch events until then.
      # Assert the core rather than assume it. Nothing public reports which core
      # is live, hence the private _collector; if a coverage bump moves it, say
      # so plainly rather than failing every PR on a bare AttributeError.
      - name: Coverage measures through sys.monitoring
        run: |
          python - <<'PY'
          import coverage

          cov = coverage.Coverage()  # picks up [tool.coverage.run] from pyproject.toml
          cov.start()
          cov.stop()
          try:
              core = cov._collector.tracer_name()
          except AttributeError as exc:
              raise SystemExit(
                  f"cannot tell which coverage core is live ({exc}). This check reads a "
                  f"private attribute and coverage {coverage.__version__} appears to have "
                  "moved it, so the check needs updating; the pytest step's measurement is "
                  "not necessarily wrong."
              ) from exc
          if core != "SysMonitor":
              raise SystemExit(
                  f"coverage chose the {core} core despite COVERAGE_CORE=sysmon. Most likely "
                  "branch coverage is now on in [tool.coverage.run], which sys.monitoring "
                  "cannot measure before CPython 3.14. Left alone, the step below would "
                  "quietly return to the slower tracer and to under-reporting the async "
                  "route modules."
              )
          print(f"coverage core: {core}")
          PY
      # COVERAGE_CORE=sysmon, set job-wide above, is what makes this step quick.
      # coverage.py's default C tracer hooks sys.settrace, which fires per line
      # executed and drops the frame out of CPython's specialising fast paths;
      # sysmon is the PEP 669 backend, which disables each location once it has
      # been seen, so a line costs once rather than once per execution. This is
      # the longest job in the run by several minutes and every deploy waits on
      # it, so the tracing overhead is worth reclaiming.
      #
      # It also raises the reported total by about a point, and that is the more
      # useful half. settrace measures per execution context, so lines resumed in
      # a greenlet after an `await session.…` counted as unrun: the async route
      # modules were being reported as less tested than they are. sys.monitoring
      # is interpreter-global and sees them wherever they resume. Checked against
      # `concurrency = ["thread", "greenlet"]` on routes/node_stream.py, the two
      # recover the same lines, and sysmon does it at a fraction of that
      # setting's cost. ONBOARDING, "Running tests", covers what this means for a
      # local figure that does not match this one.
      # One worker per logical CPU, so the count follows the runner. GitHub gives
      # public repositories four (two cores, two threads each), and on those
      # runners four workers took about a quarter off two and beat three: the
      # second thread per core pays. `logical` rather than `auto`, which counts
      # physical cores once psutil is installed and would fall back to two.
      #
      # `worksteal` rather than the default `load` scheduler matters more than
      # the count: `load` deals the tests out up front, and this suite is uneven
      # enough that at two workers one finished while the other still had two
      # thirds of the run left. `worksteal` rebalances as workers free up, and
      # at two workers roughly halved the suite. Anyone benchmarking a bare `-n`
      # will measure the disappointing number and conclude xdist does not suit
      # this suite.
      #
      # On the command line rather than in pyproject's addopts, so a local
      # `pytest` stays serial: -x stops at a different place under xdist and
      # --pdb cannot attach to a worker, and both are wanted more often when
      # debugging than the speed is.
      #
      # `--splits/--group` cuts the collected tests into three contiguous chunks
      # of equal recorded duration, from `.test_durations`. Contiguous rather
      # than pytest-split's `least_duration` bin-packing, which interleaves:
      # this suite has tests that pass or fail on what shares their process
      # (core/frame_queue.py's shards bind to the first event loop that waits on
      # them), so keeping each file's tests together and in collection order is
      # the split that least disturbs what runs beside what. A stale durations
      # file costs balance, not correctness; it only moves the two boundaries.
      #
      # `--cov-fail-under=0` overrides the 55 in pyproject's addopts for the
      # shards alone. A shard measures a third of the suite, so its own figure
      # is meaningless; backend-coverage applies the real threshold to the three
      # combined. Overriding here rather than editing addopts keeps a local
      # `pytest` enforcing the threshold exactly as it does today.
      - run: pytest tests/ -v --tb=short -m "not external" -n logical --dist worksteal --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} --cov-fail-under=0
      # include-hidden-files, because `.coverage.N` is a dotfile and v4 drops
      # those silently: without it the combine below fails on an empty download
      # rather than on anything that names this step.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: backend/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  # The threshold the shards above cannot each apply to themselves. Serial after
  # all three by construction, so it is kept to a bare checkout and a single
  # dependency: no submodules, no requirements-dev, no libs.
  backend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      # Pinned to the version uv.lock gives the shards, where pytest-cov drives
      # it: a data file's format is tied to the coverage that wrote it, and a
      # newer reader is not guaranteed to accept an older fragment.
      - run: uv pip install --system coverage==7.8.0
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: backend
      # `combine` deletes the fragments as it consumes them, so the count has to
      # be taken first. Asserting it catches the failure this job is most likely
      # to have: a download that matched fewer shards than ran, which would
      # otherwise report a plausible-looking figure over part of the suite.
      - name: All three shards reported
        run: |
          shopt -s nullglob
          fragments=(.coverage.*)
          if [ "${#fragments[@]}" -ne 3 ]; then
            printf 'expected 3 coverage fragments, found %d: %s\n' \
              "${#fragments[@]}" "${fragments[*]}" >&2
            exit 1
          fi
      - run: coverage combine
      - run: coverage report --fail-under=55

  # Its own job so that backend-tests, which gates every deploy, does not wait
  # on it: pre-commit builds its hook environments from scratch on every run,
  # actionlint's alone taking ~16s to compile.
  lint:
    name: Lint and node API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    defaults:
      run:
        working-directory: backend
    steps:
      # Installed as backend-tests installs them: the contract check imports the
      # app, and with it every lib.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # working-directory overrides the job default of `backend`: pre-commit
      # reads .pre-commit-config.yaml from the repo root. args: [backend] in
      # that config is what scopes both ops hooks.
      - name: Lint (pre-commit)
        working-directory: .
        run: pre-commit run --all-files --show-diff-on-failure
      # The node API's wire contract is generated from the routes, not authored,
      # so this is what makes it trustworthy: the committed file cannot be
      # hand-edited to match a change, because the next run regenerates it and
      # notices. A step of its own although pytest asserts the same thing,
      # because a dedicated step names the remediation instead of burying it in
      # a diff.
      #
      # RETINA_ENV because importing the app outside a test process otherwise
      # resolves as production, which refuses to start without its secrets.
      - name: Node API contract is current
        env:
          RETINA_ENV: dev
        run: python -m scripts.generate_openapi --check

  web-build:
    name: Web (${{ matrix.label || matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    strategy:
      # The workspaces are independent; a failure in one should still report
      # the others rather than cancel them. Every workspace in package.json has
      # an entry, and each of its lint, typecheck, test and build scripts runs
      # in exactly one (backend/tests/test_web_build_matrix.py).
      fail-fast: false
      matrix:
        # The dashboard's tests outlast its lint, typecheck and build together,
        # so they run in an entry of their own rather than after them.
        include:
          - { workspace: dashboard, part: checks, label: dashboard checks }
          - { workspace: dashboard, part: tests, label: dashboard tests }
          - { workspace: packages/shared }
          - { workspace: e2e }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # One workspace, one lockfile, one install; the matrix chooses whose
      # scripts run against it.
      - run: npm ci
      # The browser suite has no lint or unit tests of its own, hence
      # --if-present on those two.
      - run: npm run lint -w ${{ matrix.workspace }} --if-present
        if: matrix.part != 'tests'
      # The same command ONBOARDING gives, so the two cannot drift. For e2e it
      # typechecks the specs and the Playwright config, which nothing else
      # checks before a deploy depends on them.
      - run: npm run typecheck -w ${{ matrix.workspace }}
        if: matrix.part != 'tests'
      - run: npm test -w ${{ matrix.workspace }} --if-present
        if: matrix.part != 'checks'
      # Only the console has a build.
      - run: npm run build -w ${{ matrix.workspace }} --if-present
        if: matrix.part != 'tests'

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -t retina-server:ci .

  env-parity:
    name: Staging/production parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both services declare `env_file: backend/.env`, which holds per-host
      # secrets and so is never committed. `docker compose config` refuses to
      # resolve without it, so stand in an empty one — the check compares the
      # two overlays against each other and reads nothing out of it.
      - name: Stub backend/.env for compose resolution
        run: touch backend/.env
      # Staging only protects production while the two stay the same everywhere
      # that isn't hostnames or the simulator. This fails the build on any other
      # difference — in the compose merge or in the rendered nginx config —
      # naming the exact key so it can't be added by accident.
      - name: Check compose + nginx parity
        run: python3 deploy/check-env-parity.py

  playwright-image:
    name: Resolve the Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `edited` covers title and body edits as well as the base change we want,
    # and `changes.base` is populated only for the latter.
    if: github.event.action != 'edited' || github.event.changes.base
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # The tag is DERIVED from the lockfile rather than written out here, so
      # the browsers baked into the container cannot disagree with the client
      # that drives them. Bumping Playwright is an npm operation and nothing
      # else; there is deliberately no version string in this file to forget.
      #
      # The lockfile, not package.json: the latter carries a range (^1.59.1)
      # and `npm ci` installs whatever the lock resolved. Only the lock states
      # what will actually run.
      #
      # This job has no `if:` gate on push-to-main, unlike the two E2E jobs
      # that consume it. That is the point of the verify below — see there.
      - name: Resolve and verify
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          IMAGE="mcr.microsoft.com/playwright:v${VERSION}-noble"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # A derived tag cannot be stale, but it can name an image that was
          # never published — Microsoft does not necessarily ship one for every
          # patch release. Checked HERE, on the pull request, because the jobs
          # that pull it only run on push to main: without this, an unpublished
          # version surfaces as a container-pull failure after the merge, with
          # nothing pointing at the lockfile bump that caused it.
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::${IMAGE} does not exist in the registry. package-lock.json resolves @playwright/test to ${VERSION}, and no Playwright container image was published for it. Pin the lockfile to a release that has one."
            exit 1
          fi
          echo "Resolved and verified ${IMAGE}"

  e2e-prod:
    name: Playwright E2E (production)
    runs-on: ubuntu-latest
    # A backstop above the test step's own cap, not the primary bound: a job
    # timeout is a cancellation and would skip the rollback below, whereas the
    # step cap marks the step failed and keeps it reachable.
    timeout-minutes: 30
    needs: [production-smoke-tests, playwright-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The browsers and their shared libraries ship in the image, so there is no
    # install step at all. That step was the single worst source of red runs
    # here: `npx playwright install --with-deps` fetches the browsers from
    # Playwright's CDN, which stalled twice on 2026-08-18, and before that runs
    # an apt update, which hung for 14m34s against the runner's dead
    # azure.archive.ubuntu.com mirror on both 2026-08-18 and 2026-08-19.
    #
    # It also mattered more here than anywhere else: under the old gating an
    # install that exited non-zero satisfied `failure()` and rolled a healthy
    # production back. Removing the step removes that class of event rather
    # than only declining to act on it.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
    # See the staging job: makes the postinstall's no-op a guarantee.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      # See the staging job for why setup-node is kept inside the container.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Bounded at the step rather than relying on the job cap: a step timeout
      # marks the step failed, which still trips the rollback below, whereas a
      # job timeout is a cancellation and would skip it. A production wedged
      # badly enough to hang Playwright is exactly when the rollback is wanted.
      - name: Run E2E tests (production)
        id: e2e
        # See the staging job: the step cap has to clear nodes.spec.ts's retried
        # hooks. It matters more here, where a timed-out step rolls production back.
        timeout-minutes: 20
        run: npm run test:e2e:prod -w e2e
        env:
          CI: "true"
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
      # Scoped to the test step's own outcome, as the production smoke job is.
      # A bare failure() also fires when the container fails to pull, or when
      # checkout or npm ci fails, none of which say anything about whether
      # production is healthy. The browser install that made this urgent is
      # gone, but the reasoning outlives it: anything that breaks before the
      # tests run is a statement about the runner, not about production. An
      # infrastructure failure now leaves the job red for a human to read,
      # and only tests that ran and
      # failed roll production back.
      - name: Rollback production on E2E failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script: |
            # Same identity assertion the deploy carries, and for a stronger
            # reason: rollback.sh resets the tree, retags images over :latest and
            # cycles the stack, so a SERVER_HOST pointed at the wrong droplet
            # does more damage here than a deploy would. Inline rather than in
            # rollback.sh itself, so it holds even when the box is checked out at
            # a tree that predates the script. See deploy-production for why the
            # match is exact.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            echo "E2E tests failed — rolling back production..."
            cd ${{ env.APP_DIR }} && bash deploy/rollback.sh

  tower-service-contract:
    name: tower-finder-service honours what we forward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT restricted to main. This gate exists to stop the change
    # landing before the service can serve it, and a job that only runs after
    # the merge reports that too late to prevent one.
    #
    # Title and body edits are discarded as every other gate discards them: the
    # probe reaches production's instance, so an outage there would otherwise
    # redden a PR whose code nobody touched.
    if: github.event.action != 'edited' || github.event.changes.base
    steps:
      - uses: actions/checkout@v4
      # Production's instance answers on a name with public DNS, so it can be
      # checked from anywhere, including on a pull request.
      - name: Production's instance
        run: bash deploy/tower-contract.sh https://towers.retina.fm/api/towers

      # Staging's is a DIFFERENT container, and staging is what deploys first.
      # Checking production's instead would pass while staging's still drops the
      # parameter on the public demo, which staging serves. It is checked from
      # inside the droplet, over retina-edge, because that is the path our vhosts
      # forward on (tower-finder-service:8000). staging-towers.retina.fm reaches
      # the same container, but through the service's own edge, not that path.
      #
      # base64 so the JSON fragment survives the trip without quoting games.
      - name: Staging's instance, over retina-edge
        if: github.event_name == 'push'
        run: |
          source deploy/tower-contract.sh
          {
            echo "QUERY_B64=$(printf '%s' "$TOWER_CONTRACT_QUERY" | base64 | tr -d '\n')"
            echo "ECHO_B64=$(printf '%s' "$TOWER_CONTRACT_ECHO" | base64 | tr -d '\n')"
            # The config route the same include now forwards. Its shape check is
            # a plain read of a file in the container, so it is deterministic
            # here in a way the elevation one — which fans out to open-meteo —
            # is not; elevation is left to the public-DNS step above, which has
            # the retries for it.
            echo "CFGKEYS_B64=$(printf '%s' "$TOWER_CONTRACT_CONFIG_KEYS" | base64 | tr -d '\n')"
            # The geocode route, also forwarded by the include. Its probe is an
            # empty query the service refuses at validation, so it is as
            # deterministic here as the config read.
            echo "GEOBODY_B64=$(printf '%s' "$TOWER_CONTRACT_GEOCODE_BODY" | base64 | tr -d '\n')"
          } >> "$GITHUB_ENV"
      - name: Assert staging's instance
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        env:
          QUERY_B64: ${{ env.QUERY_B64 }}
          ECHO_B64: ${{ env.ECHO_B64 }}
          CFGKEYS_B64: ${{ env.CFGKEYS_B64 }}
          GEOBODY_B64: ${{ env.GEOBODY_B64 }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          envs: QUERY_B64,ECHO_B64,CFGKEYS_B64,GEOBODY_B64
          script: |
            set -e
            QUERY=$(printf '%s' "$QUERY_B64" | base64 -d)
            WANT=$(printf '%s' "$ECHO_B64" | base64 -d)
            CFGKEYS=$(printf '%s' "$CFGKEYS_B64" | base64 -d)
            GEOBODY=$(printf '%s' "$GEOBODY_B64" | base64 -d)
            if ! docker network inspect retina-edge >/dev/null 2>&1; then
              echo "::error::retina-edge does not exist on $(hostname), so nginx cannot reach tower-finder-service and every proxied /api/towers would 502. Bring that stack up before routing a vhost to it."
              exit 1
            fi
            BODY=$(docker run --rm --network retina-edge curlimages/curl:latest \
              -s -m 45 "http://tower-finder-service:8000/api/towers?${QUERY}") || {
              echo "::error::tower-finder-service did not answer on retina-edge from $(hostname)."
              exit 1
            }
            if ! printf '%s' "$BODY" | grep -qF "$WANT"; then
              echo "::error::staging's tower-finder-service answered without ${WANT}. Either \`frequencies\` is not implemented there yet (ClickUp 86capx9mv scope item 2), or it is implemented under a different key or JSON shape. First 300 bytes follow."
              printf '%s\n' "$BODY" | head -c 300
              exit 1
            fi

            # /api/config, forwarded by the same include on every vhost.
            CFG=$(docker run --rm --network retina-edge curlimages/curl:latest \
              -s -m 45 "http://tower-finder-service:8000/api/config") || {
              echo "::error::tower-finder-service did not answer /api/config on retina-edge from $(hostname)."
              exit 1
            }
            for key in $CFGKEYS; do
              if ! printf '%s' "$CFG" | grep -qF "$key"; then
                echo "::error::staging's tower-finder-service answered /api/config without ${key}. snippets/towers-proxy.conf forwards that route on every vhost, so pointing one at this instance would serve a config missing a key retina's callers read. First 300 bytes follow."
                printf '%s\n' "$CFG" | head -c 300
                exit 1
              fi
            done

            # /api/geocode, forwarded by the same include. An empty query is
            # refused by the service's own request model with 422, before
            # either geocoder upstream is asked; anything else means the
            # instance behind this deploy does not carry the route yet, and
            # every vhost would 404 the address lookup once it is pointed here.
            GEO=$(docker run --rm --network retina-edge curlimages/curl:latest \
              -s -m 45 -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d "$GEOBODY" \
              "http://tower-finder-service:8000/api/geocode") || {
              echo "::error::tower-finder-service did not answer /api/geocode on retina-edge from $(hostname)."
              exit 1
            }
            if [ "$GEO" != "422" ]; then
              echo "::error::staging's tower-finder-service answered /api/geocode with HTTP ${GEO}, not the 422 an empty query gets from the route. Either that instance predates the address lookup, or the request model changed. snippets/towers-proxy.conf forwards the route on every vhost, so pointing one at this instance would 404 the search form's address field."
              exit 1
            fi
            echo "staging's tower-finder-service honours the contract."

  # The one check that says whether a commit passed the gates, and so the one
  # for branch protection to require. Requiring the gates by name would let a
  # renamed or re-sharded job drop out of protection silently.
  # backend/tests/test_ci_ok.py holds `needs` to every job a pull request runs.
  ci-ok:
    # `ci-ok` only for a pull request's push or retarget, the runs whose
    # verdict protection should read. A title or body edit runs no gate, and a
    # skipped check counts as passed, so under this name an edit could clear a
    # red PR; under another it leaves the last verdict standing. A dispatch
    # tests the branch rather than the merge, so its pass must not stand for one.
    name: >-
      ${{ github.event_name != 'pull_request' && format('ci-ok ({0})', github.event_name)
      || github.event.action == 'edited' && !github.event.changes.base && 'ci-ok (title or body edit)'
      || 'ci-ok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-tests, backend-coverage, lint, web-build, docker-build, env-parity, playwright-image, tower-service-contract]
    # Never skipped, since a skipped ci-ok would pass. always() also runs it in
    # a cancelled run, where it fails; !cancelled() would skip it there.
    if: always()
    steps:
      # Anything short of success fails, skipped included: every gate runs
      # whenever this step does, so a skipped one means something upstream
      # broke. always() here too, so a run cancelled before this job started
      # still judges its cancelled gates rather than skipping to a pass.
      - name: Every gate passed
        if: always() && (github.event.action != 'edited' || github.event.changes.base)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error::${line}"; done <<< "$failed"
            exit 1
          fi
          echo "All $(jq length <<< "$NEEDS") gates passed."
      - name: A title or body edit decides nothing
        if: github.event.action == 'edited' && !github.event.changes.base
        run: echo "No gate ran, so this is not a verdict. The ci-ok check comes only from a push or a retarget."

  # Does this push touch anything the droplets serve? A merge that only reworks
  # comments would otherwise redeploy staging AND production and run both
  # Playwright suites for no change in behaviour, with the prod deploy queued
  # behind the whole staging chain to do it. deploy/deploy-scope.py holds the
  # rules and the reasons; backend/tests/test_deploy_scope.py pins its verdicts,
  # which is what makes it safe to trust.
  #
  # Gating the `staging` job alone is enough: a skipped dependency skips its
  # dependents whatever their own `if:` says, so the whole called workflow,
  # deploy-production and everything past it fall out with it. The rollback jobs
  # are keyed to `result == 'failure'`, and a skipped deploy is not a failed one,
  # so they stay dormant.
  #
  # Only the deploy chain is gated. The test matrix above still runs on a push
  # this filter clears, deliberately: it is the cheap half, it is what would
  # catch the filter being wrong, and it is what still holds a comment that binds
  # the linter rather than the interpreter.
  #
  # This asks what the push changed, not whether the droplets match main, and
  # the two differ after a deploy that failed or rolled back. Any push to main
  # used to re-run the deploy and carry the stranded commit across with it; now
  # an inert one will not. Re-run the failed deploy job rather than waiting
  # for the next merge to do it.
  changes:
    name: Is there anything to deploy?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app_dir: ${{ steps.deploy_dir.outputs.app_dir }}
    steps:
      # Workflow-level `env` does not reach a called workflow, and `with:` on a
      # calling job cannot read the `env` context either. Re-exported through an
      # output so APP_DIR above stays the one definition.
      - name: Re-export the deploy directory
        id: deploy_dir
        run: |
          set -euo pipefail
          # Refuse to hand the staging workflow an empty directory. `cd ""`
          # succeeds into $HOME, and the deploy's own pre-flights all pass there
          # (right hostname, no .env, disk fine) before `git fetch` fails in a
          # directory nothing is served from. Caught here, where the cause is
          # legible, rather than as a confusing abort on the droplet.
          if [ -z "${APP_DIR:-}" ]; then
            echo "::error::APP_DIR is empty. It is set at the top of this workflow and the staging deploy cds into it; nothing below can run without it."
            exit 1
          fi
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # The push's whole range has to be diffable and `before` can be
          # several commits back. No submodules: the filter reads paths, file
          # modes and the blobs of tracked files, and a submodule's contents are
          # never any of those: a moved gitlink is a deploy on sight.
          fetch-depth: 0
      - name: Decide
        id: filter
        # Through the environment rather than interpolated into the script, so
        # the shell never parses anything the event supplied.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The script prints the verdict and nothing else on stdout; its
          # reasoning, path by path, goes to stderr and so into this log.
          VERDICT=$(python3 deploy/deploy-scope.py "$BEFORE" "$AFTER")
          # A verdict this does not recognise must redden the run, not fall
          # through. `needs.changes.outputs.code == 'true'` reads anything else as
          # false, so a malformed line would skip the deploy chain in silence,
          # which is the one failure mode the filter is written to avoid.
          case "$VERDICT" in
            code=true|code=false) ;;
            *)
              echo "::error::deploy/deploy-scope.py printed '${VERDICT}', which is neither code=true nor code=false. Treated as a fault rather than as a verdict, because the staging gate would read it as 'nothing to deploy'."
              exit 1
              ;;
          esac
          echo "$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = "code=false" ]; then
            echo "::notice::Nothing the droplets serve changed, so skipping the deploy chain. The droplets' checkouts pick these commits up at the next code deploy."
          fi

  # Staging's deploy and its rollback and both of its verification suites, called as one job.
  # A calling job is not complete until every job in the called workflow has
  # finished, so the concurrency group below is held across the whole sequence.
  # Three grouped jobs here would not do it: the group is acquired and released
  # per job, which let a following run's deploy land between one run's smoke
  # tests and its E2E. See the called workflow.
  staging:
    name: Staging
    # `playwright-image` joins the deploy's own prerequisites so an unpublished
    # image fails the run before the droplet is touched, rather than after a
    # deploy and a smoke suite have already landed on it.
    needs: [changes, backend-tests, backend-coverage, lint, web-build, docker-build, env-parity, tower-service-contract, playwright-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    concurrency:
      group: staging-deploy
      # Queue deploys instead of cancelling: a cancelled deploy can abort after
      # `git reset --hard` but before `docker compose up -d --build`, leaving the
      # box on fresh code with stale running containers (config/image changes
      # silently never take effect). Matches deploy-production.
      #
      # At most one run sits pending per group, so a third merge arriving while
      # one run holds staging and another is queued cancels the queued one. That
      # is the right outcome — main is linear, so the newer run deploys a
      # superset of what the cancelled one would have — but it makes a cancelled
      # `Staging` job an expected state during a burst rather than a fault.
      cancel-in-progress: false
    uses: ./.github/workflows/staging-deploy-verify.yml
    with:
      app_dir: ${{ needs.changes.outputs.app_dir }}
      playwright_image: ${{ needs.playwright-image.outputs.image }}
    secrets:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_RADAR_API_KEY: ${{ secrets.STAGING_RADAR_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Above the ssh-action's own command_timeout below, so a stuck deploy
    # surfaces as that step's error rather than as a bare job timeout.
    timeout-minutes: 30
    # Gate prod on the whole staging sequence: its deploy, its smoke tests and
    # its ~127-test Playwright suite. The E2E used to run in parallel with the
    # prod deploy and so could not stop a bad build reaching prod. This
    # serialises the pipeline in exchange for real pre-prod coverage.
    needs: [staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Identity pre-flight, and deliberately the first thing of all: it is
            # the only check here that does not depend on the state of the box.
            # The .env check below cannot catch a droplet that has never been
            # deployed to, because such a box has no .env and absence has to be
            # allowed through (see below) — but it still knows its own name.
            #
            # An exact match rather than a pattern, because substring matching on
            # environment names is a trap: `latest`, `testnet` and `contest` all
            # contain `test`, so a droplet named retina-prod-latest or sitting
            # under a *.testnet. domain would be refused as if it were the test
            # box. setup-server.sh sets this name from RETINA_TARGET_ENV, so a
            # fully provisioned droplet always satisfies it; anything else is
            # either the wrong box or a rebuild that never finished, and neither
            # should take a production deploy.
            if [ "$(hostname)" != "retina-prod" ]; then
              echo "::error::Refusing to deploy production onto '$(hostname)' — expected retina-prod. If this droplet was rebuilt, finish provisioning it (hostnamectl set-hostname retina-prod); otherwise this job is pointed at the wrong box."
              exit 1
            fi

            # Checked immediately after identity, and for a similar reason: if
            # this box is still mid-deploy from an earlier run, none of the
            # questions below it are worth asking.
            #
            # The marker is written after pre-deploy.sh and cleared when the app
            # comes back healthy or a rollback succeeds. This run has not written
            # one yet, so finding one here means an earlier attempt was left half
            # deployed and never recovered — its rollback failed, or the run was
            # cancelled before one could.
            #
            # Deploying over that would destroy the only way back. pre-deploy.sh
            # snapshots the CURRENTLY RUNNING container as the new rollback
            # point, so it would capture the broken build, discard the good one,
            # and then the marker write would overwrite the evidence too. The
            # next rollback would faithfully restore the breakage.
            #
            # Deliberately ANY marker rather than one from another run: "Re-run
            # failed jobs" keeps the same run id, and a retry poisons the
            # snapshot exactly as a fresh run would.
            #
            # The cost is that an incident which leaves a marker behind also
            # blocks deploys until a human clears it. That is the intended
            # trade: the box is in an unknown state and its rollback point is
            # the thing at risk.
            if [ -f .deploy-in-progress ]; then
              echo "::error::${{ env.APP_DIR }}/.deploy-in-progress is still present on $(hostname) ($(cat .deploy-in-progress)). An earlier deploy was left mid-flight and never confirmed healthy — its rollback failed, or was cancelled before it ran. Deploying now would snapshot the broken container as the new rollback point and lose the good one. Inspect the box and recover it (bash deploy/rollback.sh, or fix forward), then delete the marker and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi

            # Second pre-flight, before anything below mutates the box: a .env
            # naming the WRONG environment is the one remaining error that has to
            # be caught before pre-deploy.sh runs. That script
            # reads the current image through `docker compose images`, so it
            # resolves through whatever this file says; staging's .env here would
            # have it snapshot the wrong service and then deploy production onto
            # staging's hostnames, fleet and container names.
            #
            # A MISSING .env is deliberately allowed through. It used to be a hard
            # refusal, which turned out to be unshippable: production has never had
            # one, and the file it would name (docker-compose.prod.yml) does not
            # exist in the tree production is currently checked out at — it arrives
            # with the git reset below. Refusing here meant the deploy could never
            # run, and writing the file by hand beforehand was worse: compose would
            # then resolve against an overlay that is not there yet, pre-deploy.sh
            # would warn "no running image found" and carry on, and the largest
            # deploy this box has taken would have gone out with no rollback point.
            # With no .env at all, compose resolves the base alone, which is
            # exactly production's current config, so the snapshot is correct.
            #
            # The file is then written from the checked-out tree, below.
            if [ -f .env ] && ! grep -q '^COMPOSE_FILE=.*docker-compose\.prod\.yml' .env; then
              echo "::error::${{ env.APP_DIR }}/.env exists but does not select the production overlay — it names another environment. Inspect it; do not deploy."
              exit 1
            fi

            # Third pre-flight: the two secrets that production cannot boot
            # without, again before anything mutates the box.
            # docker-compose.prod.yml names this environment `production`, and
            # under that name backend/core/users.py and backend/routes/test.py
            # each raise at import time when their secret is unset. The failure
            # would be a crash-looping container, and the rollback steps hang off
            # the smoke and E2E jobs, which are skipped when this job fails — so
            # an unset secret leaves production down until a human SSHes in. A
            # refused deploy is the better outcome.
            #
            # Both are checked, because both fail the same way: RADAR_API_KEY is
            # set on the box today, so only JWT_SECRET was at risk on the deploy
            # that introduced this, but a guard that covers one of a matched pair
            # invites the other to rot.
            #
            # JWT_SECRET carries a length bound as well, to reject the
            # placeholder in backend/.env.example, which is published in this
            # repo and would otherwise satisfy a mere presence check.
            # Both read the LAST matching line rather than any of them, because
            # that is the one that reaches the container: compose's env_file
            # takes last-occurrence-wins on a repeated key. The remediation
            # below tells an operator to append, so a duplicate is the likely
            # shape of a botched rotation, and checking any line would pass on
            # the old value while the app booted with the new one.
            if ! grep -E '^JWT_SECRET=' backend/.env 2>/dev/null | tail -1 | grep -qE '^JWT_SECRET=.{32,}$'; then
              echo "::error::backend/.env has no effective JWT_SECRET of at least 32 characters, and production refuses to boot without one (backend/core/users.py). On the droplet, replacing any existing line: printf 'JWT_SECRET=%s\n' \"\$(openssl rand -hex 32)\" >> ${{ env.APP_DIR }}/backend/.env"
              exit 1
            fi
            if ! grep -E '^RADAR_API_KEY=' backend/.env 2>/dev/null | tail -1 | grep -qE '^RADAR_API_KEY=.+$'; then
              echo "::error::backend/.env has no effective RADAR_API_KEY, and production refuses to boot without one (backend/routes/test.py), which would also take /api/test/dashboard with it."
              exit 1
            fi

            # Pre-flight: Cloudflare's origin-pull CA, checked BEFORE anything
            # stops or rebuilds the stack. nginx renders `ssl_verify_client on`
            # (deploy/nginx/snippets/tls.conf) and start.sh refuses to boot
            # without the CA, so on a droplet where the human half of this work
            # is not done — enable Authenticated Origin Pulls for the zone, put
            # the CA on the box — the rebuild below would fail to start and
            # leave production DOWN. It would also not roll back: both rollback
            # paths are gated on the smoke/E2E jobs, and those are skipped when
            # this job itself fails. Refusing here converts that outage into a
            # refused deploy; everything above this line only reads the box.
            #
            # Staging carries the identical check, but staging passing proves
            # nothing about this droplet — the CA is per-box state, not
            # something the pipeline ships.
            CF_CA=/etc/ssl/cloudflare/origin-pull-ca.pem
            if [ ! -f "$CF_CA" ]; then
              echo "::error::${CF_CA} is missing on $(hostname). nginx requires Cloudflare's origin-pull CA and will not start without it. Enable Authenticated Origin Pulls for the zone, then fetch the CA onto this droplet (curl -fsS --create-dirs -o ${CF_CA} https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem) and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            if ! openssl x509 -in "$CF_CA" -noout >/dev/null 2>&1; then
              echo "::error::${CF_CA} exists on $(hostname) but is not a parseable PEM certificate — a truncated download or an error page saved to the path would look exactly like this. nginx would fail to start. Replace it and re-run. Refusing to deploy; the running stack is untouched."
              exit 1
            fi
            echo "Origin-pull CA present and parseable: ${CF_CA}"

            # Pre-flight: refuse to deploy when the disk is near full. Without
            # this, git fetch silently writes a partial pack ("No space left on
            # device"), the working tree never advances, and the subsequent
            # `docker compose --build` reuses every cached layer and "succeeds"
            # with yesterday's image (run 25923117075 — backend, frontend, and
            # dashboard were all stale).
            AVAIL_MB=$(df -m / | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MB:-0}" -lt 2048 ]; then
              echo "::error::Production disk only ${AVAIL_MB}MB free (< 2GB threshold). Aborting deploy."
              df -h /
              docker system df 2>/dev/null || true
              exit 1
            fi

            # Pre-deploy: save rollback image + git tag. NOT `|| true`: if we
            # cannot capture a rollback point, abort the deploy rather than ship
            # with no way back. A swallowed failure here previously let a deploy
            # proceed with a stale/absent rollback image, so a later rollback
            # silently restored the wrong build.
            bash deploy/pre-deploy.sh

            # From here on the box is mid-deploy: a rollback point now exists,
            # and everything below moves the tree or the running containers.
            # The marker is what lets the rollback job tell "died in a
            # pre-flight, stack untouched" from "died with production half
            # deployed" — the two need opposite responses.
            #
            # Every check that can refuse the deploy sits ABOVE this line, which
            # is the property the rollback job depends on. The disk pre-flight
            # used to sit below it; it refuses without touching anything, so a
            # full disk would have been read as a half-finished deploy and cost
            # production a needless down/up cycle. Keep new pre-flights above.
            #
            # The run id is not decoration: the rollback job refuses to act on a
            # marker written by a different run, because that means an earlier
            # deploy was left mid-flight and never recovered.
            echo "run ${{ github.run_id }} started $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > ${{ env.APP_DIR }}/.deploy-in-progress

            # Hard-reset rather than `git pull`: the latter aborts silently on
            # divergent branches (deploy run 25481699738 — the server had a
            # local commit, pull printed a hint and exited 0, the build then
            # cached every layer because the source hadn't actually changed,
            # and the new bundle never made it to /app/dashboard/dist).
            # `set -e` above guarantees a failed fetch/reset aborts the deploy.
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive

            # Select the production overlay, now that the reset has actually put
            # docker-compose.prod.yml on disk. This must sit after the reset and
            # before the first compose command below — the whole chicken-and-egg
            # is that the file naming the overlay is useless until the overlay
            # exists. pre-deploy.sh above has already taken its snapshot against
            # the previous config, which is what a rollback needs to restore.
            cp deploy/env.prod.example .env
            # Top up with this host's own CARTO basemap key — see the note in
            # deploy/env.<env>.example. Guarded rather than chained with &&: a host
            # with no key must build watermarked tiles, not fail its deploy.
            if [ -f /root/.secrets/carto.env ]; then cat /root/.secrets/carto.env >> .env; fi

            # Each build orphans the image it replaces and nothing else on the
            # box removes them, so they accumulate until the pre-flight above
            # refuses the deploy. Dangling only: `-a` goes by what no container
            # references, which is exactly the rollback point tagged above.
            # Before the builder prune, which cannot free a layer an image holds.
            docker image prune -f
            # Cap build cache at ~10GB (LRU eviction) rather than wiping it all,
            # bounding total size so cache growth can't trip the disk pre-flight.
            # The stale-layer incident this guarded against (commit 01ca7f6) was
            # rooted in disk-full (partial git pack -> source never advanced ->
            # cache reused); the disk pre-flight above now catches that root
            # cause, so a full wipe is redundant and only forced slow from-scratch
            # rebuilds. 10GB leaves ample headroom on both droplets (>60GB free).
            docker builder prune -f --keep-storage 10GB
            # Deploy the app FIRST, on its own. Building only `server`
            # here means a broken Dockerfile.fleet can't abort the production
            # app deploy. Production runs no fleet simulator (see the `sim`
            # profile in docker-compose.prod.yml), so `server` is the
            # whole of the production deploy; staging is the same now.
            # --remove-orphans because this deploy renamed the compose
            # service. container_name is pinned, so the container kept by the
            # old service key is an orphan holding the exact name the new one
            # needs, and compose leaves orphans alone by default: the create
            # then fails with a name conflict and the stack does not come up.
            # Verified on retina-test before this landed. It stays afterwards
            # as the general guard for a removed or renamed service.
            docker compose up -d --build --remove-orphans server

            # Wait for backend to become healthy (up to 90s — matches staging
            # and the healthcheck start_period; a cold boot can need >60s).
            for i in $(seq 1 18); do
              if docker compose exec -T server python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Deploy successful (healthy after ~$((i*5))s)"
                break
              fi
              echo "Waiting for health check... attempt $i/18"
              sleep 5
              if [ "$i" = "18" ]; then
                echo "Health check failed after 90s"
                docker compose logs --tail=50
                exit 1
              fi
            done

            # Reached only by the loop's `break`, i.e. the app answered
            # /api/health. The box is no longer mid-deploy, so drop the marker;
            # any failure after this point is a smoke/E2E failure, which the
            # rollback steps on those jobs already cover.
            rm -f ${{ env.APP_DIR }}/.deploy-in-progress

  rollback-production-on-deploy-failure:
    name: Roll back production if the deploy failed after it began
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-production]
    # Same group as deploy-production. The slot frees the moment that job ends,
    # so without this a following push's deploy can be inside `git reset --hard`
    # and `docker compose up --build` in the deploy directory while rollback.sh
    # is running `git reset --hard` and `docker compose down` in the same
    # directory. Serialising can delay a rollback behind a queued deploy, which
    # is the lesser problem: that deploy takes its own snapshot and supersedes
    # the rollback, whereas two writers in one directory corrupts both.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # `always() && ...result == 'failure'` rather than a bare `failure()`.
    # failure() is true when ANY ancestor job failed, and deploy-production has
    # ancestors: a staging failure skips the deploy entirely, and this job
    # would then SSH into production to consider rolling back a deploy that
    # never ran. Keyed to the deploy job's own result, it cannot.
    #
    # This is the gap the two existing rollbacks do not cover. Both hang off
    # jobs DOWNSTREAM of the deploy (production-smoke-tests, e2e-prod), and a
    # failed deploy skips those jobs and their rollback steps with them.
    # 'cancelled' as well as 'failure'. Cancelling mid-deploy leaves production
    # exactly as half-deployed as a crash does, and deploy-production sets
    # cancel-in-progress: false, so this can only be a human pressing cancel —
    # never the pipeline cancelling itself. The marker check below still makes
    # a cancel during the pre-flights a no-op.
    # A cancelled PR can also mark its skipped deploy as cancelled. Repeat the
    # deploy's main-push gate so PRs and manual CI runs never open production SSH.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (
        needs.deploy-production.result == 'failure' ||
        needs.deploy-production.result == 'cancelled'
      )
    steps:
      - name: Roll back, but only if the deploy actually mutated the box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR
          script: |
            set -e
            # The same identity assertion the deploy and the other two rollback
            # paths carry, inline for the same reason: rollback.sh resets the
            # tree and retags images over :latest, so a SERVER_HOST pointed at
            # the wrong droplet does more damage here than a deploy would.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            cd ${{ env.APP_DIR }}

            # deploy-production writes this marker immediately after
            # pre-deploy.sh captures the rollback point, and clears it once the
            # app answers /api/health. Its absence means the deploy died in its
            # pre-flights with the running stack untouched.
            #
            # Rolling back in that case would be actively harmful rather than
            # merely pointless: retina-server:rollback and the newest deploy-*
            # tag still describe the PREVIOUS deploy's snapshot, so rollback.sh
            # would drag production back past a deploy that succeeded in order
            # to recover from one that never started.
            if [ ! -f .deploy-in-progress ]; then
              echo "No .deploy-in-progress marker — the deploy failed before mutating anything, so what is running is already the last-known-good build. Nothing to roll back."
              exit 0
            fi

            MARKER=$(cat .deploy-in-progress)

            # The marker records which run wrote it. One from a DIFFERENT run
            # means an earlier deploy was left mid-flight and never recovered —
            # its rollback failed, or someone cancelled and walked away — and
            # this run then died in its own pre-flights without touching
            # anything.
            #
            # Rolling back on that would be a guess. The box could be an
            # unrecovered outage, or one a human has already fixed forward by
            # hand and not tidied up after; rollback.sh would undo the second.
            # Reporting "nothing to roll back" would be worse still — a green
            # run over a production box that is genuinely broken. So stop, and
            # say exactly what is ambiguous.
            case "$MARKER" in
              "run ${{ github.run_id }} "*) ;;
              *)
                echo "::error::${{ env.APP_DIR }}/.deploy-in-progress was left behind by a different run (${MARKER}). Production was put mid-deploy earlier and never confirmed healthy since. Refusing to roll back automatically, because this run touched nothing and cannot tell an unrecovered outage from a box already fixed by hand. Inspect retina-prod, recover it, then delete the marker."
                exit 1
                ;;
            esac

            echo "Deploy failed after it began mutating the box (${MARKER}). Rolling back..."

            # rollback.sh distinguishes three outcomes and `set -e` would
            # collapse the last two, so take its status explicitly.
            set +e
            bash deploy/rollback.sh
            rc=$?
            set -e

            case "$rc" in
              0)
                rm -f .deploy-in-progress
                echo "Rollback complete — production is back on the previous build."
                ;;
              2)
                # Service restored, but the database is left ahead of the code
                # now running against it. The box is no longer mid-deploy, so
                # the marker goes; the run stays red so a human sees the report.
                rm -f .deploy-in-progress
                echo "::error::Production is back up, but a database downgrade is outstanding — see the report above before trusting this rollback."
                exit 2
                ;;
              *)
                # Marker deliberately left in place: the box is still
                # mid-deploy, and that is exactly what the next run must know.
                echo "::error::Rollback FAILED (exit ${rc}). Production may still be down — SSH to retina-prod and recover by hand, then delete ${{ env.APP_DIR }}/.deploy-in-progress so the next deploy is not blocked by it."
                exit "$rc"
                ;;
            esac


  production-smoke-tests:
    name: Production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [deploy-production]
    # On the job so the wait and the checks cannot disagree about the host.
    env:
      BASE_URL: https://api.retina.fm
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to answer through the edge
        timeout-minutes: 5
        run: |
          # Waits for the path these tests take. The deploy job confirmed
          # /api/health inside the container on localhost:8000, which covers
          # neither the edge nor nginx, and the deploy restarts nginx.
          # Not a warmup gate: the checks below own their waits, and a 200 here
          # could not serve as one anyway, as services/health.py skips a task's
          # staleness check until that task has first succeeded.
          # Nothing here asserts node counts: fleet health is not a deploy gate.
          DEADLINE=$((SECONDS + 90))
          STREAK=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            # Liveness mode, not ?strict=1, which 503s on fleet conditions
            # (node dropout, miss rate) that no deploy causes.
            BODY=$(curl -s --connect-timeout 5 --max-time 10 "${BASE_URL}/api/health" || true)
            case "$BODY" in
              *'"status"'*) STREAK=$((STREAK + 1)) ;;
              *)            STREAK=0 ;;
            esac
            # Three running, so nginx answering from the outgoing container
            # mid-restart cannot read as the new one.
            if [ "$STREAK" -ge 3 ]; then
              echo "Answering through the edge after ~${SECONDS}s: ${BODY}"
              exit 0
            fi
            sleep 2
          done
          # Must not fail the job: the smoke tests fail and roll production back,
          # and failing here would suppress that when production is down.
          echo "::warning::No answer from ${BASE_URL}/api/health three times running in 90s; letting the smoke tests judge."
      - name: Run production smoke tests
        id: smoke
        timeout-minutes: 15
        # Passage through Cloudflare Access for the admin vhost. An unset secret
        # renders empty, and tower-contract.sh sends no headers at all in that
        # case, so this is inert until the Access application and the service
        # token both exist. Failing this step rolls production back, so it must
        # not become the reason a deploy reverts.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          CURL="curl -s --connect-timeout 10 --max-time 60"
          # PASS/FAIL/WARN and smoke_summary, shared with deploy/staging-smoke-test.sh.
          # Absolute: a working-directory default on this job would otherwise
          # break the source, and this step failing rolls production back.
          source "$GITHUB_WORKSPACE/deploy/smoke-tally.sh"
          # assert_origin_marker: proves THIS repo's nginx answered, not merely
          # that the hostname did. Absolute for the same reason as above.
          source "$GITHUB_WORKSPACE/deploy/origin-marker.sh"
          # assert_page_asset: proves a mounted bundle resolves the assets it
          # names. Shared with the staging suite so the two cannot drift.
          source "$GITHUB_WORKSPACE/deploy/page-asset.sh"
          # assert_legacy_redirect: proves a retired hostname still reaches the
          # surface it was retired into. Shared for the same reason.
          source "$GITHUB_WORKSPACE/deploy/legacy-redirects.sh"

          check_origin() {
            local name="$1" url="$2" out
            printf "  %-40s " "$name"
            if out=$(assert_origin_marker "$url"); then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "FAIL"; printf '    %s\n' "$out"; FAIL=$((FAIL+1))
            fi
          }

          check_page_asset() {
            local name="$1" page="$2" out
            printf "  %-40s " "$name"
            if out=$(assert_page_asset "$page"); then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "FAIL"; printf '    %s\n' "$out"; FAIL=$((FAIL+1))
            fi
          }

          check_status() {
            local name="$1" url="$2" expected="$3"
            printf "  %-40s " "$name"
            # Retry once on connection error (transient load spikes just after
            # the app restarts)
            CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || CODE=$($CURL -o /dev/null -w "%{http_code}" "$url" 2>/dev/null) \
              || { echo "FAIL (connection)"; FAIL=$((FAIL+1)); return; }
            if [ "$CODE" = "$expected" ]; then echo "OK ($CODE)"; PASS=$((PASS+1)); else echo "FAIL ($CODE != $expected)"; FAIL=$((FAIL+1)); fi
          }

          echo "── Production Smoke Tests ──"
          check_status "GET /api/health"          "${BASE_URL}/api/health"            "200"
          check_status "GET /api/radar/nodes"     "${BASE_URL}/api/radar/nodes"       "200"
          check_status "GET /api/radar/analytics" "${BASE_URL}/api/radar/analytics"   "200"
          check_status "GET /api/test/dashboard"  "${BASE_URL}/api/test/dashboard"    "200"
          check_status "GET /api/test/mlat-verification" "${BASE_URL}/api/test/mlat-verification" "200"
          # No /api/config check on BASE_URL (api.retina.fm): that vhost defines
          # no /api/config location, so the request falls through `location /`
          # to the app — which no longer implements the route. The monolith's
          # tower stack was deleted once every /api/ vhost was proxied to
          # tower-finder-service, so this would now be a 404 by design. The
          # route is checked where it is actually served, on the tower vhosts
          # below.
          # On app, not towers: since the 2026-09-14 origin flip Cloudflare sends
          # towers.retina.fm to tower-finder-service's own edge, so that probe
          # asserted a different service's frontend while this job rolls THIS
          # one back on failure. app is the production surface we still serve.
          check_status "GET / (console)"          "https://app.retina.fm/"            "200"
          check_status "GET /api/health (api.retina.fm)" "${BASE_URL}/api/health"     "200"

          echo ""
          echo "── Which origin answered ──"
          # A status code proves a hostname responded, not that WE responded.
          # tower-finder-service answers /api/health with the same 200 and the
          # same security headers, so every check above passes identically
          # against either origin — which is exactly how the 2026-09-14 flip of
          # towers.retina.fm went unnoticed while this job rolled production
          # back on failure. These assert the marker only this repo's nginx
          # sets. This job has no check_header of its own; assert_origin_marker
          # is shared with the staging suite so the two cannot drift.
          # admin is absent because Cloudflare Access answers a browserless
          # request with a 302 from the edge, carrying no origin headers.
          check_origin "api vhost is this origin"  "${BASE_URL}/api/health"
          # /api/health, not a page path: nginx drops every inherited add_header
          # in a location that declares one of its own, and spa.conf's page
          # locations declare a Cache-Control, so the marker reaches its API
          # responses only.
          check_origin "app vhost is this origin"  "https://app.retina.fm/api/health"

          echo ""
          echo "── Does the console render ──"
          # An index.html whose assets miss still answers 200: a blank screen
          # no status check here can see. This follows the page's own script
          # URL and requires JavaScript back.
          check_page_asset "app / loads its bundle" "https://app.retina.fm/"

          echo ""
          echo "── Do the retired hostnames still reach it ──"
          # No vhost claims these; Cloudflare redirects them onto the app host,
          # and this origin would refuse them with a 421. Warned rather
          # than failed: the rules are the edge's, so no deploy here can have
          # broken one and rolling this release back cannot fix one.
          # Host, path probed, and where it must land.
          for rule in "map.retina.fm|/|https://app.retina.fm/map" \
                      "dash.retina.fm|/smoke-redirect|https://app.retina.fm/smoke-redirect" \
                      "data.retina.fm|/|https://app.retina.fm/data"; do
            IFS='|' read -r LEGACY_HOST LEGACY_PATH LEGACY_TARGET <<< "$rule"
            printf "  %-40s " "$LEGACY_HOST"
            if REASON=$(assert_legacy_redirect "$LEGACY_HOST" "$LEGACY_PATH" "$LEGACY_TARGET"); then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "WARN"; printf '    %s\n' "$REASON"; WARN=$((WARN+1))
              echo "::warning::${LEGACY_HOST} no longer redirects to the app surface. It is a retired hostname with no vhost, so it is now refused at the origin. Restore the Cloudflare redirect rule."
            fi
          done

          # The tower-finder seam, on production's OWN vhost names. Same
          # assertion as the staging suite, from the same file.
          # towers.retina.fm is deliberately absent, for the reason given above:
          # every name below is one nginx here actually answers.
          source "$GITHUB_WORKSPACE/deploy/tower-contract.sh"
          for endpoint in https://app.retina.fm/api/towers \
                          https://api.retina.fm/towers \
                          https://admin.retina.fm/api/towers; do
            printf "  %-40s " "${endpoint#https://}"
            # 2 is our nginx having forwarded to a service that did not answer.
            # Warned, not failed: this job rolls production back, and the service
            # being down is not grounds for reverting a healthy release here. See
            # _is_upstream_failure in deploy/tower-contract.sh.
            if REASON=$(assert_tower_contract "$endpoint"); then
              TC_RC=0
            else
              TC_RC=$?
            fi
            if [ "$TC_RC" = 0 ]; then
              echo "OK"; PASS=$((PASS+1))
            elif [ "$TC_RC" = 2 ]; then
              echo "WARN"; printf '    %s\n' "$REASON"; WARN=$((WARN+1))
              echo "::warning::tower search is unreachable behind ${endpoint#https://}: our nginx forwarded and tower-finder-service did not answer. Not a deploy fault and not rolled back."
            else
              echo "FAIL"; printf '    %s\n' "$REASON"; FAIL=$((FAIL+1))
            fi
          done

          # The sibling routes the same include forwards, on the vhost a human
          # looks at. app replaces towers here for the reason given above.
          for endpoint in https://app.retina.fm; do
            printf "  %-40s " "${endpoint#https://}/api/elevation"
            # 2 is the service answering that its own upstream is unavailable.
            # Passed, loudly: this job rolls production back on a failure, and a
            # third party's rate limiter is not grounds for that. The routing
            # this probe covers rests on the 404 case, which stays fatal here and
            # on the two checks alongside; none of the three is strict about a
            # gateway status any more.
            if REASON=$(assert_elevation_contract "${endpoint}/api/elevation"); then
              EL_RC=0
            else
              EL_RC=$?
            fi
            if [ "$EL_RC" = 0 ]; then
              echo "OK"; PASS=$((PASS+1))
            elif [ "$EL_RC" = 2 ]; then
              echo "WARN"; printf '    %s\n' "$REASON"; WARN=$((WARN+1))
              echo "::warning::elevation is degraded on ${endpoint#https://}: the service's upstream provider is refusing lookups, so the search form's altitude prefill is down. Not a deploy fault and not rolled back. ClickUp 86cbaxrhp."
            else
              echo "FAIL"; printf '    %s\n' "$REASON"; FAIL=$((FAIL+1))
            fi
            printf "  %-40s " "${endpoint#https://}/api/config"
            # 2 as above: forwarded, upstream silent. Same reasoning, same verdict.
            if REASON=$(assert_config_contract "${endpoint}/api/config"); then
              CFG_RC=0
            else
              CFG_RC=$?
            fi
            if [ "$CFG_RC" = 0 ]; then
              echo "OK"; PASS=$((PASS+1))
            elif [ "$CFG_RC" = 2 ]; then
              echo "WARN"; printf '    %s\n' "$REASON"; WARN=$((WARN+1))
              echo "::warning::tower config is unreachable behind ${endpoint#https://}: our nginx forwarded and tower-finder-service did not answer. Not a deploy fault and not rolled back."
            else
              echo "FAIL"; printf '    %s\n' "$REASON"; FAIL=$((FAIL+1))
            fi
            # Strict, like config: the probe stops at the service's own input
            # validation and never reaches a geocoder, so there is no third
            # party here whose outage could roll production back.
            printf "  %-40s " "${endpoint#https://}/api/geocode"
            if REASON=$(assert_geocode_contract "${endpoint}/api/geocode"); then
              echo "OK"; PASS=$((PASS+1))
            else
              echo "FAIL"; printf '    %s\n' "$REASON"; FAIL=$((FAIL+1))
            fi
          done

          # Check aircraft data is flowing
          AIRCRAFT=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['pipeline']['aircraft_on_map'])" 2>/dev/null) || AIRCRAFT=0
          printf "  %-40s " "Aircraft on map > 0"
          if [ "${AIRCRAFT:-0}" -gt 0 ]; then echo "OK ($AIRCRAFT)"; PASS=$((PASS+1)); else echo "WARN ($AIRCRAFT: real nodes may be quiet or still connecting)"; WARN=$((WARN+1)); fi

          # Guard against a runaway population. Production runs no simulator now,
          # so anything near this ceiling means either a `--profile sim` fleet was
          # left running or the analytics manager is not evicting (ClickUp
          # 86caxcbc3). Kept at 220 rather than retightened to the real headcount
          # so a node cutover cannot fail a deploy.
          NODES=$(curl -sk "${BASE_URL}/api/test/dashboard" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes']['active'])" 2>/dev/null) || NODES=0
          printf "  %-40s " "Active nodes ≤ 220"
          if [ "${NODES:-0}" -le 220 ]; then echo "OK ($NODES)"; PASS=$((PASS+1)); else echo "FAIL ($NODES > 220 — a simulator fleet may be running, or nodes are not being evicted)"; FAIL=$((FAIL+1)); fi

          echo ""
          smoke_summary
          [ "$FAIL" -eq 0 ] || exit 1
      # Auto-rollback on smoke failure, mirroring the prod E2E job. A failed
      # smoke test means a bad build is live serving prod; revert to
      # last-known-good rather than leaving it up for a human to catch. The
      # condition is scoped to the smoke step's own outcome, so a failure in the
      # wait step above fails the job for a human to inspect without
      # triggering an automatic rollback.
      - name: Rollback production on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script: |
            # See the identical assertion in e2e-prod's rollback step.
            [ "$(hostname)" = "retina-prod" ] || { echo "::error::Refusing to roll back on '$(hostname)' — expected retina-prod."; exit 1; }
            echo "Production smoke tests failed — rolling back production..."
            cd ${{ env.APP_DIR }} && bash deploy/rollback.sh
