name: Claude Code Review

on:
  # No `ready_for_review`. Every push is reviewed, so undrafting could only
  # re-review a diff that already has one, and under the collapse below that
  # duplicate would fold the pass worth reading and replace it with an
  # identical one.
  pull_request:
    types: [opened, synchronize, reopened]

# A push mid-review must replace the running review rather than start a second
# one beside it. The part-ticked comment a cancelled run leaves is folded by the
# run that supersedes it, best-effort: a fold that fails leaves it expanded.
# The fallback keeps the group distinct if a non-pull_request trigger is ever
# added, since pull_request.number is empty for those.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Reviews run to about ten minutes; this is the ceiling for one that hangs
    # rather than a target, and it bounds a stalled gh call in the fold below.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required to resolve a comment's run id to its workflow path, for the fold below

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          track_progress: true
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The review skill fans out to subagents, which the Agent tool runs in
          # the background by default: the parent dispatches, stops, and is woken
          # by a task notification when they finish. That loop does not exist
          # here. Headless, the turn ending is the process exiting, so a parent
          # that backgrounds the fan-out takes the run down with its agents still
          # working and the review unwritten. Tell it where it is running, since
          # nothing else does. Foreground dispatch costs no parallelism: agents
          # launched together in one message still run concurrently.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "This is a headless CI job with no interactive loop. When your turn ends the process exits, killing any subagent still running and discarding its work, and no task notification will ever reach you. Dispatch subagents with run_in_background: false so their results return inside your turn; several agents launched in a single message still run concurrently. Do not end your turn while dispatched work is outstanding, or while any item on your progress checklist is still unticked."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The instruction above is a nudge, not a guarantee, and nothing else here
      # notices: the action reports success whenever the model's turn ends without
      # an API error, and a turn that ends having posted no review is not an
      # error. So the stall described above stays possible, and stays silent.
      # Seven of thirty-five runs sampled on 2026-08-20, before that instruction
      # existed, ended that way (#199, #201, #204, #206), each leaving its
      # progress checklist part-ticked.
      #
      # Read that checklist back, because an unfinished review is otherwise
      # indistinguishable from a clean one. This depends on track_progress above:
      # the checklist is the only thing separating "did not finish" from
      # "finished and found nothing", since a review that finds nothing also
      # posts no findings (step 6 of the skill stops when nothing scores 80+).
      - name: Assert the review completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Single definition: the guard below and the fold's origin check both need it.
          WORKFLOW_PATH: .github/workflows/claude-code-review.yml
        run: |
          # The action refuses to run when this file differs from the copy on the
          # default branch, which stops a pull request rewriting its own reviewer
          # to reach the secrets. It skips, reports success, and reviews nothing.
          # Without this, the check below would fail every pull request that edits
          # this workflow, over a review that was never allowed to happen.
          #
          # Ask what the pull request changes rather than comparing this file's
          # content against the default branch: a branch cut before this file last
          # changed still carries the old copy, and a content comparison reads that
          # as an edit, skipping the check below on every stale branch.
          #
          # Names only. `gh pr diff` would fetch the whole patch to read them, and
          # the API refuses to generate a diff at all once one grows large enough,
          # which would stop the guard running on the bulk changes it most wants to
          # see. First line is hasNextPage, the rest are paths, so position tells
          # the two apart and no path can be mistaken for the flag.
          files_query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){files(first:100){nodes{path} pageInfo{hasNextPage}}}}}'
          changed=$(gh api graphql \
            -f "query=${files_query}" \
            -f "owner=${REPO%/*}" -f "name=${REPO#*/}" \
            -F "number=${PR_NUMBER}" \
            --jq '.data.repository.pullRequest.files | (.pageInfo.hasNextPage | tostring), .nodes[].path' \
            2>"${RUNNER_TEMP}/guard.err") || {
            # An unreadable list fails towards demanding a review: a pull request
            # that did edit this file fails below rather than passing unreviewed.
            changed=""
            echo "::warning::could not list this pull request's changed files, so the self-edit guard did not run. If this step then fails having seen no review, that is the likely cause rather than anything it names: $(tr '\n' ' ' < "${RUNNER_TEMP}/guard.err")"
          }
          if [ "$(printf '%s\n' "${changed}" | head -1)" = "true" ]; then
            echo "::warning::past 100 files here, so the self-edit guard only read the first 100 and may have missed an edit to this workflow"
          fi
          if printf '%s\n' "${changed}" | tail -n +2 | grep -qxF "${WORKFLOW_PATH}"; then
            echo "::notice::This pull request edits the review workflow, so the action skipped itself and no review ran. That is its guard against a pull request editing its own reviewer, not a fault in this change. Nothing supersedes the earlier comments either, so any left part-ticked by a cancelled run stay expanded here. Reviews resume on the pull requests that follow this one onto ${DEFAULT_BRANCH}, and this one needs reviewing by hand."
            exit 0
          fi

          # One object per line, not one array per page. With --paginate the --jq
          # filter runs once per page, so an array projection emits a separate
          # array each time and json.load refuses the second one.
          gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | {body: .body, url: .html_url, node_id: .node_id, login: .user.login, type: .user.type}' > "${RUNNER_TEMP}/comments.jsonl"
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          BOT = "claude[bot]"
          REPO = os.environ["REPO"]
          run_id = os.environ["GITHUB_RUN_ID"]

          with open(os.path.join(os.environ["RUNNER_TEMP"], "comments.jsonl")) as fh:
              comments = [json.loads(line) for line in fh if line.strip()]

          def prose(comment):
              # Findings quote code, and a quoted checklist or run link belongs to
              # whatever the finding quoted, not to the comment carrying it.
              return re.sub(r"```.*?```", "", comment["body"] or "", flags=re.DOTALL)

          def by_bot(comment):
              return comment["type"] == "Bot" and comment["login"] == BOT

          # The action appends a "View job" link naming its own run before the step
          # returns, which is what ties a comment to this run rather than to an
          # earlier review of the same pull request. Authorship narrows it further:
          # anyone may quote a run link, but only the reviewer posts the checklist.
          marker = f"/actions/runs/{run_id}"
          mine = [c for c in comments if by_bot(c) and marker in prose(c)]

          if not mine:
              # A renamed reviewer must not redden every pull request, but the
              # fallback has to stay narrower than "any bot": a third party
              # quoting this run's link would otherwise satisfy the gate.
              mine = [
                  c for c in comments
                  if c["type"] == "Bot" and "claude" in (c["login"] or "").lower() and marker in prose(c)
              ]
              if mine:
                  print(f"::warning::the review posted as {mine[-1]['login']}, not {BOT}. Update BOT in this workflow.")

          if not mine:
              raise SystemExit(
                  f"::error::The review posted no comment for run {run_id}. Every review is "
                  f"expected to leave a progress comment from {BOT} linking back to its own "
                  "job, so either it failed before posting anything, track_progress is no "
                  "longer set on the step above, or the reviewer no longer posts under that "
                  "name. Until that is settled this check cannot tell a finished review from "
                  "an abandoned one."
              )

          # Only ever one, but prefer the newest if the action's format ever changes.
          unticked = re.findall(r"^\s*- \[ \] .*$", prose(mine[-1]), re.MULTILINE)
          if unticked:
              todo = "\n".join(unticked)
              print(f"Progress comment: {mine[-1]['url']}")
              print(f"Unfinished:\n{todo}")
              raise SystemExit(
                  f"::error::The review stopped partway and left {len(unticked)} step(s) "
                  "unfinished, so this pull request has not been reviewed. Re-run the job. "
                  "This is usually the review skill's subagents being dispatched to the "
                  "background and the run ending underneath them; a re-run generally picks a "
                  "different path and completes."
              )

          print(f"Review completed: {mine[-1]['url']}")


          def gh(*args):
              # A stalled call must not hold the runner after the review above has
              # already passed. A timeout is returned as an ordinary failure so it
              # stays local to one comment, rather than raising past the loop and
              # abandoning every comment after it.
              try:
                  return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  return subprocess.CompletedProcess(args, 1, "", "timed out after 60s")
              except OSError as exc:
                  return subprocess.CompletedProcess(args, 1, "", f"could not run gh: {exc}")

          def fold_superseded():
              # Reviews run on every push, so a pull request three times round the
              # loop otherwise reads as three reviews, two of them answered and stale.
              # Read here, not at module scope: folding must never redden a review
              # that passed, and only what runs inside this function is caught.
              workflow = os.environ["WORKFLOW_PATH"]
              owner, name = REPO.split("/")
              # REST does not carry isMinimized, so ask once rather than re-folding
              # every already-folded comment on every later run.
              listed = gh(
                  "api", "graphql",
                  # `last`, not `first`: comments come back oldest-first, and it is
                  # the recently folded ones that are worth knowing about.
                  "-f", "query=query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){comments(last:100){pageInfo{hasPreviousPage} nodes{id isMinimized}}}}}",
                  "-f", f"owner={owner}", "-f", f"name={name}",
                  "-F", f"number={os.environ['PR_NUMBER']}",
                  "--jq", "{ids: [.data.repository.pullRequest.comments.nodes[] | select(.isMinimized) | .id], more: .data.repository.pullRequest.comments.pageInfo.hasPreviousPage}",
              )
              # An empty set only costs a redundant mutation, so every way of
              # failing to read the list falls back to it rather than stopping.
              folded_already = set()
              if listed.returncode != 0:
                  print(f"::warning::could not list folded comments, so each is re-attempted: {listed.stderr.strip()}")
              else:
                  try:
                      page = json.loads(listed.stdout)
                      folded_already = set(page["ids"])
                      if page["more"]:
                          print("::warning::past 100 comments here, so the older folded ones are re-attempted each run")
                  except (ValueError, KeyError, TypeError) as exc:
                      print(f"::warning::could not read the folded-comment list, so each is re-attempted: {exc!r}")

              paths = {}
              unresolved = set()

              def origin_of(rid):
                  # Reviews and @claude replies post as the same bot, so the author
                  # alone cannot tell a superseded review from a conversation.
                  if rid in paths:
                      return paths[rid]
                  done = gh("api", f"repos/{REPO}/actions/runs/{rid}", "--jq", ".path")
                  if done.returncode != 0:
                      # A failure is retried rather than cached, so a blip on one
                      # comment cannot settle the answer for the rest of the run.
                      # The warning is not, or a bad scope repeats it per comment.
                      if rid not in unresolved:
                          unresolved.add(rid)
                          print(f"::warning::run {rid} would not resolve, so its comment stays expanded. Check the actions: read scope above: {done.stderr.strip()}")
                      return None
                  paths[rid] = done.stdout.strip()
                  return paths[rid]

              # Only the newest attempt is this run's live comment. A re-run keeps
              # the run id and posts a fresh comment rather than editing the old
              # one, so earlier attempts are superseded and fold with the rest.
              mine_ids = {mine[-1]["node_id"]}
              for c in comments:
                  if c["node_id"] in mine_ids or c["node_id"] in folded_already:
                      continue
                  if not by_bot(c):
                      # Only a bot that is not the reviewer is worth a line; the
                      # human discussion on a pull request is not news.
                      if c["type"] == "Bot":
                          print(f"left expanded (bot {c['login']}, not {BOT}): {c['url']}")
                      continue
                  found = re.search(r"/actions/runs/(\d+)", prose(c))
                  if not found:
                      print(f"left expanded (no run link): {c['url']}")
                      continue
                  origin = origin_of(found.group(1))
                  if origin != workflow:
                      print(f"left expanded (run {found.group(1)} is {origin}): {c['url']}")
                      continue
                  done = gh(
                      "api", "graphql",
                      "-f", "query=mutation($id:ID!){minimizeComment(input:{subjectId:$id,classifier:OUTDATED}){clientMutationId}}",
                      "-f", f"id={c['node_id']}",
                  )
                  if done.returncode == 0:
                      print(f"folded: {c['url']}")
                  else:
                      print(f"::warning::could not fold {c['url']}: {done.stderr.strip()}")

          # Folding is presentational, so it must never redden a review that passed.
          try:
              fold_superseded()
          except Exception as exc:
              print(f"::warning::folding superseded reviews failed, leaving them expanded: {exc!r}")
          PY
